        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":5},"id":101,"title":"Cost Trends","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":15,"lineWidth":2},"unit":"currencyUSD"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":6},"id":5,"options":{"legend":{"calcs":["sum","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_cost_usd_total[5m])) by (framework) * 3600","legendFormat":"{{ framework }}"}],"title":"Cost Rate by Framework (USD/hour)","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":15,"lineWidth":2},"unit":"currencyUSD"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":6},"id":6,"options":{"legend":{"calcs":["sum","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_cost_usd_total[5m])) by (model) * 3600","legendFormat":"{{ model }}"}],"title":"Cost Rate by Model (USD/hour)","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":14},"id":102,"title":"Cost Breakdown","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"}},"overrides":[]},"gridPos":{"h":8,"w":8,"x":0,"y":15},"id":7,"options":{"displayLabels":["name","percent"],"legend":{"displayMode":"table","placement":"right","values":["value","percent"]},"pieType":"donut"},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_cost_usd_total[1h])) by (framework)","legendFormat":"{{ framework }}"}],"title":"Cost Share by Framework (1h)","type":"piechart"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":20,"lineWidth":2},"unit":"currencyUSD"},"overrides":[]},"gridPos":{"h":8,"w":8,"x":16,"y":15},"id":9,"options":{"legend":{"calcs":["mean"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_cost_usd_total[5m])) by (tenant_id) * 3600","legendFormat":"tenant: {{ tenant_id }}"}],"title":"Cost Rate by Tenant (USD/hour)","type":"timeseries"}
      ],
      "refresh": "1m",
      "schemaVersion": 38,
      "tags": ["agentfabric","cost","tokens","ai-agents"],
      "time": {"from":"now-24h","to":"now"},
      "timezone": "browser",
      "title": "AgentFabric — Cost Report",
      "uid": "agentfabric-cost",
      "version": 1
    }

