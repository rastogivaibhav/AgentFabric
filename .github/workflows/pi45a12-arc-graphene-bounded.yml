name: PI4.5A.1.2 ARC GrapheneDB bounded episodic memory

on:
  pull_request:
    branches: [master]
    paths:
      - 'pi45_a1/bounded_chat_proxy.py'
      - '.github/workflows/pi45a12-arc-graphene-bounded.yml'

permissions:
  contents: read

jobs:
  episodic:
    name: bounded-${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: [ls20, ft09, bp35]

    steps:
      - name: Checkout execution-only PR
        uses: actions/checkout@v4

      - name: Reconstruct and verify frozen A1 payload
        shell: bash
        run: |
          set -euo pipefail
          cat pi45_a1/payload.part.00 pi45_a1/payload.part.01 pi45_a1/payload.part.02 > /tmp/pi45a1_payload.tgz.b64
          test "$(wc -c < /tmp/pi45a1_payload.tgz.b64)" -eq 15112
          echo '6e23baa3a1c6b9855c1cdfd38f6ce367d95b524ee59a97be7113be08555b0fc7  /tmp/pi45a1_payload.tgz.b64' | sha256sum -c -
          base64 -d /tmp/pi45a1_payload.tgz.b64 > /tmp/pi45a1_payload.tgz
          echo '0e10bc6e81feab2071d1e75b1dc398656e666801ae0a608edf747b25af5857d6  /tmp/pi45a1_payload.tgz' | sha256sum -c -
          mkdir -p /tmp/pi45a1
          tar -xzf /tmp/pi45a1_payload.tgz -C /tmp/pi45a1
          cd /tmp/pi45a1
          echo '63f205b3dbbad0d580dc8a262edbf8dd432c3ce6df173e0f888ac2188eeb78d1  arc_a1_graphene_episodic.py' | sha256sum -c -
          echo '0c517b8c25b118bb85924ca5446f7b6cdb16b895c464e928a45ca532b3f5db8b  pi45_graphene_memory.cpp' | sha256sum -c -
          echo '1fe625d28b1edda6a034bb442d50de8a901f8579fea658d8b073928239e0da54  CMakeLists.txt' | sha256sum -c -
          echo '66a24a5b1632a386c6a6f5a5ce91bdda207149ebab8389535bb5c00110b38a86  test_arc_a1_graphene_episodic.py' | sha256sum -c -
          python3 -m py_compile arc_a1_graphene_episodic.py
          python3 -m py_compile "$GITHUB_WORKSPACE/pi45_a1/bounded_chat_proxy.py"
          ! grep -q 'causal_search(' arc_a1_graphene_episodic.py
          ! grep -q 'lattice_neighbors(' arc_a1_graphene_episodic.py
          ! grep -q 'FiberBundle' arc_a1_graphene_episodic.py

      - name: Install ARC toolkit and run frozen contract tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl git python3.12 python3.12-venv
          python3.12 -m venv /tmp/pi45venv
          /tmp/pi45venv/bin/pip install --upgrade pip
          /tmp/pi45venv/bin/pip install 'arc-agi==0.9.9' pytest
          /tmp/pi45venv/bin/python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('arc-agi') == '0.9.9'
          print('arc_agi_version=0.9.9')
          PY
          sudo mkdir -p /mnt/data/pi45a1 /mnt/data/pi45a0
          sudo chown -R "$USER":"$USER" /mnt/data/pi45a1 /mnt/data/pi45a0
          cp /tmp/pi45a1/arc_a1_graphene_episodic.py /mnt/data/pi45a1/arc_a1_graphene_episodic.py
          base64 -d pi45_arc/arc_a0_baseline.py.gz.b64 | gzip -d > /mnt/data/pi45a0/arc_a0_baseline.py
          echo '8c251f9bd3241aa1bdaac988ce462b08ab570fb7bcb89ee21c168dc7cf728e62  /mnt/data/pi45a0/arc_a0_baseline.py' | sha256sum -c -
          cd /tmp/pi45a1
          /tmp/pi45venv/bin/pytest -q test_arc_a1_graphene_episodic.py

      - name: Verify and build pinned GrapheneDB episodic helper
        shell: bash
        run: |
          set -euo pipefail
          GDB="$GITHUB_WORKSPACE/pi45_a1/graphenedb_snapshot"
          MANIFEST="$GDB/SOURCE_MANIFEST.txt"
          test -f "$MANIFEST"
          grep -qx 'pinned_commit=9dfe3681c315008377710a0731eab78ebba798a9' "$MANIFEST"
          grep -qx 'source_mode=vendored-byte-identical-core' "$MANIFEST"
          while read -r rel expected; do
            case "$rel" in
              include/*|src/*)
                actual="$(git hash-object "$GDB/$rel")"
                test "$actual" = "$expected" || {
                  echo "GrapheneDB source identity mismatch: $rel expected=$expected actual=$actual" >&2
                  exit 1
                }
                ;;
            esac
          done < "$MANIFEST"
          cmake -S /tmp/pi45a1 -B /tmp/pi45a1/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRAPHENEDB_SOURCE_DIR="$GDB"
          cmake --build /tmp/pi45a1/build --target pi45_graphene_memory -j 2
          test -x /tmp/pi45a1/build/pi45_graphene_memory
          printf '%s\n' '9dfe3681c315008377710a0731eab78ebba798a9' > /tmp/graphenedb_commit.txt
          printf '%s\n' 'vendored-byte-identical-core' > /tmp/graphenedb_source_mode.txt
          sha256sum "$MANIFEST" > /tmp/graphenedb_source_manifest_SHA256SUMS.txt

      - name: Build pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout 9ee9fc04c136ef2ae729bfc60d18961b23c13ddf
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = '9ee9fc04c136ef2ae729bfc60d18961b23c13ddf'
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build --target llama-server -j 2

      - name: Download and verify frozen Qwen
        shell: bash
        run: |
          set -euo pipefail
          MODEL=/tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 \
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true' \
            -o "$MODEL"
          echo '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  /tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf' | sha256sum -c -
          sha256sum "$MODEL" > /tmp/model_SHA256SUMS.txt

      - name: Run A1.2 bounded episodic game
        shell: bash
        env:
          MODEL_ALIAS: pi45a1-qwen25-15b
          ARC_GAMES: ${{ matrix.game }}
          MAX_ACTIONS: '40'
          MEMORY_WINDOW: '6'
          CONTEXT_SIZE: '8192'
          PROMPT_BUDGET_CHARS: '8000'
          OUT_DIR: results/pi45a12/${{ matrix.game }}
          GRAPHENE_HELPER: /tmp/pi45a1/build/pi45_graphene_memory
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          cp /tmp/model_SHA256SUMS.txt "$OUT_DIR/model_SHA256SUMS.txt"
          cp /tmp/graphenedb_commit.txt "$OUT_DIR/graphenedb_commit.txt"
          cp /tmp/graphenedb_source_mode.txt "$OUT_DIR/graphenedb_source_mode.txt"
          cp /tmp/graphenedb_source_manifest_SHA256SUMS.txt "$OUT_DIR/graphenedb_source_manifest_SHA256SUMS.txt"
          cp pi45_a1/graphenedb_snapshot/SOURCE_MANIFEST.txt "$OUT_DIR/graphenedb_SOURCE_MANIFEST.txt"
          sha256sum pi45_a1/bounded_chat_proxy.py > "$OUT_DIR/bounded_chat_proxy_SHA256SUMS.txt"
          git -C /tmp/llama.cpp rev-parse HEAD > "$OUT_DIR/llama_cpp_commit.txt"
          printf '%s\n' \
            "game=${ARC_GAMES}" \
            "max_actions=${MAX_ACTIONS}" \
            "memory_window=${MEMORY_WINDOW}" \
            "context_size=${CONTEXT_SIZE}" \
            "prompt_budget_chars=${PROMPT_BUDGET_CHARS}" \
            "graphenedb_mode=episodic_nodes_vector_search_only" \
            "a12_context_policy=head_tail_deterministic_bound" \
            "a12_validity_gate=llm_errors_zero" > "$OUT_DIR/treatment_contract.txt"

          /tmp/llama.cpp/build/bin/llama-server \
            -m /tmp/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            -c "$CONTEXT_SIZE" --host 127.0.0.1 --port 9091 --alias pi45a1-qwen25-15b \
            > "$OUT_DIR/llama_server.log" 2>&1 &
          SERVER_PID=$!

          python3 pi45_a1/bounded_chat_proxy.py \
            --listen 9090 --target http://127.0.0.1:9091 \
            --budget-chars "$PROMPT_BUDGET_CHARS" \
            --log "$OUT_DIR/context_proxy.jsonl" \
            > "$OUT_DIR/context_proxy.log" 2>&1 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9090/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1

          /tmp/pi45venv/bin/python /tmp/pi45a1/arc_a1_graphene_episodic.py \
            --games "$ARC_GAMES" --max-actions "$MAX_ACTIONS" --memory-window "$MEMORY_WINDOW" \
            --graphene-helper "$GRAPHENE_HELPER" --out "$OUT_DIR"
          test -f "$OUT_DIR/summary.json"

          OUT_DIR="$OUT_DIR" PROMPT_BUDGET_CHARS="$PROMPT_BUDGET_CHARS" python3 - <<'PY'
          import json, os
          out=os.environ['OUT_DIR']
          x=json.load(open(os.path.join(out, 'summary.json')))
          assert x['graphenedb_enabled'] is True
          assert x['graphenedb_mode']=='episodic_nodes_vector_search_only'
          assert x['persistent_world_model'] is False
          assert x['causal_edges_enabled'] is False
          assert x['hex_fiber_reasoning_enabled'] is False
          assert x['epistemic_gate_enabled'] is False
          assert x['model_sha256']=='6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e'
          for g in x['games']:
              st=g.get('graphenedb_stats') or {}
              assert st.get('valid') is True, (g.get('game_id'), st)
              assert st.get('edges') == 0, (g.get('game_id'), st)
              inst=g.get('instrumentation') or {}
              assert inst.get('llm_errors', 0) == 0, (g.get('game_id'), inst)
          proxy=[]
          p=os.path.join(out,'context_proxy.jsonl')
          if os.path.exists(p):
              proxy=[json.loads(line) for line in open(p) if line.strip()]
          posts=[r for r in proxy if r.get('method')=='POST']
          assert posts, 'no proxied inference requests recorded'
          budget=int(os.environ['PROMPT_BUDGET_CHARS'])
          assert all(r.get('bounded_chars',0) <= budget for r in posts), posts[-3:]
          metrics={
              'requests': len(posts),
              'truncated_requests': sum(bool(r.get('truncated')) for r in posts),
              'max_original_chars': max(r.get('original_chars',0) for r in posts),
              'max_bounded_chars': max(r.get('bounded_chars',0) for r in posts),
              'budget_chars': budget,
          }
          json.dump(metrics, open(os.path.join(out,'context_bound_metrics.json'),'w'), indent=2, sort_keys=True)
          print('pi45a12_bounded_episodic_contract=PASS')
          print(json.dumps(metrics, indent=2))
          print(json.dumps(x['aggregate'], indent=2))
          PY

      - name: Hash available evidence
        if: always()
        shell: bash
        env:
          OUT_DIR: results/pi45a12/${{ matrix.game }}
        run: |
          set -u
          mkdir -p "$OUT_DIR"
          find "$OUT_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > "$OUT_DIR/SHA256SUMS.txt"
          printf '%s\n' "job_status=${{ job.status }}" "game=${{ matrix.game }}" > "$OUT_DIR/job_status.txt"

      - name: Upload A1.2 game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi45a12-arc-graphenedb-${{ matrix.game }}-evidence
          path: results/pi45a12/${{ matrix.game }}
          if-no-files-found: error
          retention-days: 14
