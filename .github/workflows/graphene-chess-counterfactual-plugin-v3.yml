name: Graphene Chess Counterfactual Plugin v3
on:
  push:
    branches: [arc-paper-dmw-duck-20260821]
    paths:
      - 'arc_competition/graphene_chess_counterfactual_v3.py'
      - 'arc_competition/chess_counterfactual_plugin_v2.py'
      - 'arc_competition/build_chess_counterfactual_native_helper.sh'
      - 'arc_competition/chess_rules.json'
      - '.github/workflows/graphene-chess-counterfactual-plugin-v3.yml'
  pull_request:
    branches: [pi45-a15-dialectical-model-world-20260821]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-v3-query-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Build unchanged native runtime and plugin helper
        run: |
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_chess_counterfactual_native_helper.sh /tmp/chess_counterfactual_native_helper
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot pi45_a1/a15_native_runtime_helper.cpp
      - name: Run eight strict native selections
        env: {PYTHONPATH: 'pi45_a1:arc_competition'}
        run: |
          rm -rf /tmp/graphene-chess-plugin-v3 /tmp/graphene_chess_v3.ply-*.graphenedb*
          python3 arc_competition/graphene_chess_counterfactual_v3.py \
            --native-helper /tmp/chess_counterfactual_native_helper \
            --bootstrap /tmp/a15_graphene_bootstrap \
            --db-prefix /tmp/graphene_chess_v3 \
            --rules arc_competition/chess_rules.json --plies 8 \
            --out /tmp/graphene-chess-plugin-v3 | tee /tmp/graphene-chess-v3.log
      - name: Assert no fallback and current-turn primary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/graphene-chess-plugin-v3'); s=json.loads((p/'summary.json').read_text())
          assert s['completed_plies']==8 and s['all_moves_legal']
          assert s['plugin_selected_move'] is False and s['projection_isolation'] is True
          for i in range(1,9):
              r=json.loads((p/f'ply_{i:02d}.json').read_text())
              assert r['primary_hypothesis_id'].startswith(f'ply-{i-1}-move-'), r
              assert r['selected_hypothesis_id']==r['primary_hypothesis_id'], r
              assert float(r['confidence'])>0 and r['primary_node'] not in (None,0), r
              assert any(f.get('hypothesis_id')==r['primary_hypothesis_id'] and f.get('eligible_support_paths',0)>0 for f in r['debug_fibers']), r
          print('graphene_chess_counterfactual_plugin_v3=PASS')
          PY
      - name: Record evidence
        if: always()
        run: |
          mkdir -p /tmp/graphene-chess-plugin-v3
          cp /tmp/graphene-chess-v3.log /tmp/graphene-chess-plugin-v3/run.log 2>/dev/null || true
          printf '%s\n' "agentfabric_commit=${GITHUB_SHA}" 'plugin=v3-query-scoped-projection' 'core_graphenedb_modified=false' 'core_hypokosh_modified=false' 'stockfish=false' 'opening_book=false' 'llm_move_selector=false' > /tmp/graphene-chess-plugin-v3/experiment_identity.txt
          find /tmp/graphene-chess-plugin-v3 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-chess-plugin-v3/SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-chess-counterfactual-plugin-v3-evidence
          path: /tmp/graphene-chess-plugin-v3
          if-no-files-found: error
          retention-days: 30
