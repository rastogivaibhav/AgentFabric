name: Graphene Chess Selection Causality P4.4
on:
  pull_request:
    paths:
      - 'arc_competition/chess_counterfactual_plugin_v5.py'
      - 'arc_competition/graphene_chess_selection_causality_p44.py'
      - 'arc_competition/chess_rules.json'
      - 'arc_competition/build_chess_counterfactual_native_helper_p42.sh'
      - '.github/workflows/graphene-chess-selection-causality-p44.yml'
  workflow_dispatch:
jobs:
  p44-selection-causality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Build unchanged native runtime and expanded-budget helper
        run: |
          set -euo pipefail
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_chess_counterfactual_native_helper_p42.sh /tmp/chess_counterfactual_native_helper_p44
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot pi45_a1/a15_native_runtime_helper.cpp
      - name: Run 20 whole-evidence candidate-order permutations
        env:
          PYTHONPATH: pi45_a1:arc_competition
        run: |
          set -uo pipefail
          rm -rf /tmp/graphene-chess-p44 /tmp/graphene_chess_p44.seed-*.graphenedb*
          mkdir -p /tmp/graphene-chess-p44
          set +e
          python3 arc_competition/graphene_chess_selection_causality_p44.py \
            --native-helper /tmp/chess_counterfactual_native_helper_p44 \
            --bootstrap /tmp/a15_graphene_bootstrap \
            --db-prefix /tmp/graphene_chess_p44 \
            --rules arc_competition/chess_rules.json \
            --runs 20 \
            --out /tmp/graphene-chess-p44 | tee /tmp/graphene-chess-p44/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/graphene-chess-p44/process_exit_code.txt
          exit "$rc"
      - name: Record evidence identity
        if: always()
        run: |
          mkdir -p /tmp/graphene-chess-p44
          printf '%s\n' "agentfabric_commit=${GITHUB_SHA}" 'experiment=GCDT-P4.4-whole-evidence' 'permutations=20' 'core_graphenedb_modified=false' 'core_hypokosh_modified=false' 'stockfish=false' 'opening_book=false' 'llm_move_selector=false' > /tmp/graphene-chess-p44/experiment_identity.txt
          find /tmp/graphene-chess-p44 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-chess-p44/SHA256SUMS.txt
      - name: Upload P4.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-chess-selection-causality-p44-evidence
          path: /tmp/graphene-chess-p44
          if-no-files-found: error
          retention-days: 30
