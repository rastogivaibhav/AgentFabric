{{- if .Values.monitoring.dashboards.enabled }}
{{/*
  Grafana dashboard ConfigMaps — one per dashboard JSON.

  Grafana sidecar (grafana.sidecar.dashboards.enabled) watches for ConfigMaps
  labelled grafana_dashboard=1 in the monitoring namespace and hot-loads them.
  Set monitoring.dashboards.enabled=true in values.yaml to deploy these.

  Requirements:
    - kube-prometheus-stack (or standalone Grafana) installed in the
      monitoring.grafanaNamespace namespace with the dashboard sidecar enabled.
    - The sidecar must be configured to watch ALL namespaces or the namespace
      where these ConfigMaps are deployed.
*/}}

# ─── Platform Overview ────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfabric-dashboard-overview
  namespace: {{ .Values.monitoring.grafanaNamespace | default "monitoring" }}
  labels:
    grafana_dashboard: "1"
    {{- include "agentfabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    grafana-folder: "AgentFabric"
data:
  agentfabric-overview.json: |
    {
      "__inputs": [{"name":"DS_PROMETHEUS","label":"Prometheus","description":"","type":"datasource","pluginId":"prometheus","pluginName":"Prometheus"}],
      "__requires": [
        {"type":"grafana","id":"grafana","name":"Grafana","version":"10.0.0"},
        {"type":"datasource","id":"prometheus","name":"Prometheus","version":"1.0.0"},
        {"type":"panel","id":"timeseries","name":"Time series","version":""},
        {"type":"panel","id":"stat","name":"Stat","version":""},
        {"type":"panel","id":"gauge","name":"Gauge","version":""},
        {"type":"panel","id":"piechart","name":"Pie chart","version":""}
      ],
      "description": "AgentFabric — platform health, throughput, cost, and AI framework observability",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"title":"Platform Health","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"0":{"color":"red","index":0,"text":"DOWN"},"1":{"color":"green","index":1,"text":"UP"}},"type":"value"}],"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"gridPos":{"h":4,"w":4,"x":0,"y":1},"id":1,"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"up{job=\"agentfabric-collector\"}","legendFormat":"Collector"}],"title":"Collector","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"0":{"color":"red","index":0,"text":"DOWN"},"1":{"color":"green","index":1,"text":"UP"}},"type":"value"}],"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"gridPos":{"h":4,"w":4,"x":4,"y":1},"id":2,"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"up{job=\"agentfabric-api-gateway\"}","legendFormat":"API Gateway"}],"title":"API Gateway","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"axisLabel":"req/s","fillOpacity":10,"lineWidth":2},"unit":"reqps"},"overrides":[]},"gridPos":{"h":8,"w":8,"x":8,"y":1},"id":3,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_http_requests_total[2m])) by (method)","legendFormat":"{{ method }}"}],"title":"Request Rate by Method","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"axisLabel":"error %","fillOpacity":20,"lineWidth":2},"max":100,"min":0,"unit":"percent","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":1},{"color":"red","value":5}]}},"overrides":[]},"gridPos":{"h":8,"w":8,"x":16,"y":1},"id":4,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"single"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"100 * sum(rate(agentfabric_http_requests_total{status=~\"5..\"}[5m])) / sum(rate(agentfabric_http_requests_total[5m]))","legendFormat":"Error Rate %"}],"title":"HTTP Error Rate","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":9},"id":101,"title":"Latency","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":10,"lineWidth":2},"unit":"s"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":10},"id":5,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"histogram_quantile(0.50, sum(rate(agentfabric_http_duration_seconds_bucket[5m])) by (le))","legendFormat":"P50"},{"datasource":{"uid":"agentfabric-prometheus"},"expr":"histogram_quantile(0.95, sum(rate(agentfabric_http_duration_seconds_bucket[5m])) by (le))","legendFormat":"P95"},{"datasource":{"uid":"agentfabric-prometheus"},"expr":"histogram_quantile(0.99, sum(rate(agentfabric_http_duration_seconds_bucket[5m])) by (le))","legendFormat":"P99"}],"title":"API Latency (P50 / P95 / P99)","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":18},"id":102,"title":"Span Throughput","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]},"unit":"short"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":19},"id":7,"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]},"textMode":"auto"},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_spans_received_total[5m])) * 60","legendFormat":"Spans/min"}],"title":"Spans Received (per minute)","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":10,"lineWidth":2},"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":19},"id":9,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_spans_received_total[2m])) by (framework) * 60","legendFormat":"{{ framework }}"}],"title":"Spans/min by AI Framework","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":27},"id":103,"title":"Cost & Token Usage","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":50},{"color":"red","value":100}]},"unit":"currencyUSD"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":28},"id":10,"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"rate(agentfabric_cost_usd_total[1h]) * 3600","legendFormat":"USD/hour"}],"title":"Cost Rate (USD/hour)","type":"stat"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":36},"id":104,"title":"PII & Policy","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":37},"id":13,"options":{"colorMode":"background","graphMode":"area","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"rate(agentfabric_pii_redactions_total[5m]) * 60","legendFormat":"PII/min"}],"title":"PII Redactions (per minute)","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":6,"y":37},"id":14,"options":{"colorMode":"background","graphMode":"area","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"rate(agentfabric_policy_decisions_total{result=\"deny\"}[5m]) * 60","legendFormat":"Blocks/min"}],"title":"Policy Blocks (per minute)","type":"stat"}
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["agentfabric","observability","ai-agents"],
      "time": {"from":"now-1h","to":"now"},
      "timezone": "browser",
      "title": "AgentFabric — Platform Overview",
      "uid": "agentfabric-overview",
      "version": 1
    }

