name: Graphene Generic Hidden Rule P6B

on:
  pull_request:
    paths:
      - 'arc_competition/generic_goal_discovery_plugin_v1.py'
      - 'arc_competition/graphene_generic_goal_discovery_p6d.py'
      - 'arc_competition/build_generic_goal_discovery_native_helper_p6d.sh'
      - '.github/workflows/graphene-generic-hidden-rule-p6b.yml'
  workflow_dispatch:

jobs:
  p6b-hidden-rule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build unchanged native runtime and P6D retrieval helper
        run: |
          set -euo pipefail
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_generic_goal_discovery_native_helper_p6d.sh /tmp/generic_goal_discovery_native_helper_p6d
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot pi45_a1/a15_native_runtime_helper.cpp
      - name: Run autonomous dialectical goal discovery
        env:
          PYTHONPATH: pi45_a1:arc_competition
        run: |
          set -euo pipefail
          rm -rf /tmp/graphene-p6d /tmp/graphene_p6d.*.graphenedb*
          mkdir -p /tmp/graphene-p6d
          python3 arc_competition/graphene_generic_goal_discovery_p6d.py \
            --native-helper /tmp/generic_goal_discovery_native_helper_p6d \
            --bootstrap /tmp/a15_graphene_bootstrap \
            --db-prefix /tmp/graphene_p6d \
            --runs 10 \
            --out /tmp/graphene-p6d | tee /tmp/graphene-p6d/run.log
      - name: Record evidence identity
        if: always()
        run: |
          mkdir -p /tmp/graphene-p6d
          printf '%s\n' \
            "agentfabric_commit=${GITHUB_SHA}" \
            'experiment=P6D-autonomous-dialectical-goal-discovery' \
            'explicit_objective_supplied_to_plugin=false' \
            'terminal_success_signal_only=true' \
            'goal_worlds=W-X2,W-X3' \
            'retrieval_anchor_prefix=hidden-v4-' \
            'core_graphenedb_modified=false' \
            'core_hypokosh_modified=false' \
            'plugin_selects_goal=false' \
            'plugin_selects_action=false' \
            'llm_selector=false' \
            > /tmp/graphene-p6d/experiment_identity.txt
          find /tmp/graphene-p6d -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-p6d/SHA256SUMS.txt
      - name: Upload P6D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-generic-goal-discovery-p6d-evidence
          path: /tmp/graphene-p6d
          if-no-files-found: error
          retention-days: 30
