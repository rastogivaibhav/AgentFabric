name: ARC Paper Duck GrapheneDMW Integration Gate

on:
  pull_request:
    branches: [pi45-a15-dialectical-model-world-20260821]
    paths:
      - 'arc_competition/**'
      - 'pi45_a1/a15_state_contract.json'
      - 'pi45_a1/a15_contract_gate.py'
      - '.github/workflows/arc-paper-duck-dmw-integration-gate.yml'
  push:
    branches: [arc-paper-dmw-duck-20260821]
    paths:
      - 'arc_competition/**'
      - 'pi45_a1/a15_state_contract.json'
      - 'pi45_a1/a15_contract_gate.py'
      - '.github/workflows/arc-paper-duck-dmw-integration-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test GrapheneDMW competition bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            arc_competition/graphene_dmw_duck_bridge.py \
            arc_competition/apply_duck_graphene_patch.py \
            arc_competition/apply_duck_graphene_patch_v2.py \
            arc_competition/test_graphene_dmw_duck_bridge.py
          bash -n arc_competition/build_duck_kaggle_variant.sh
          python3 -m unittest -v arc_competition/test_graphene_dmw_duck_bridge.py
          set +e
          bash arc_competition/build_duck_kaggle_variant.sh dialectic /tmp/should-not-be-created >/tmp/dialectic-block.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 64
          grep -q 'intentionally blocked' /tmp/dialectic-block.log

      - name: Fetch exact Milestone-1 Duck source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/duck-harness
          git clone --filter=blob:none https://github.com/Tufalabs/duck-harness.git /tmp/duck-harness
          git -C /tmp/duck-harness checkout 7652836056c59e044f093e3c13ed7438c814169e
          test "$(git -C /tmp/duck-harness rev-parse HEAD)" = '7652836056c59e044f093e3c13ed7438c814169e'

      - name: Assert proven Qwen 27B config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/tmp/duck-harness/ARC3-Inference/configs/inference.json').read_text())
          assert cfg['shared']['model_name']=='vrfai/Qwen3.6-27B-FP8'
          assert cfg['shared']['provider']=='vllm'
          assert int(cfg['shared']['context_window'])==32768
          assert cfg['server']['tool_call_parser']=='qwen3_coder'
          assert cfg['server']['reasoning_parser']=='qwen3'
          print('duck_qwen27_config=PASS')
          PY

      - name: Apply fail-closed GrapheneDMW patch
        shell: bash
        run: |
          set -euo pipefail
          python3 arc_competition/apply_duck_graphene_patch_v2.py /tmp/duck-harness \
            --manifest-out /tmp/duck_patch_manifest.json
          python3 -m py_compile \
            /tmp/duck-harness/ARC3-Inference/inference/agent/tool_agent.py \
            /tmp/duck-harness/ARC3-Inference/inference/agent/graphene_dmw_bridge.py \
            /tmp/duck-harness/ARC3-Inference/inference/framework/solver.py
          grep -q 'GrapheneDMWDuckBridge' /tmp/duck-harness/ARC3-Inference/inference/agent/tool_agent.py
          grep -q 'graphene_negative_evidence' /tmp/duck-harness/ARC3-Inference/inference/agent/tool_agent.py
          grep -q 'record_transition' /tmp/duck-harness/ARC3-Inference/inference/agent/tool_agent.py
          grep -q 'prompt_context' /tmp/duck-harness/ARC3-Inference/inference/agent/tool_agent.py
          grep -q 'graphene_dmw_mode' /tmp/duck-harness/ARC3-Inference/inference/framework/solver.py
          grep -q 'TAAF_KAGGLE_SETUP_ENV' /tmp/duck-harness/ARC3-Inference/inference/framework/solver.py

      - name: Prove baseline remains selectable
        shell: bash
        run: |
          set -euo pipefail
          GRAPHENE_DMW_MODE=off PYTHONPATH=/tmp/duck-harness/ARC3-Inference python3 - <<'PY'
          from inference.agent.graphene_dmw_bridge import GrapheneDMWDuckBridge
          from pathlib import Path
          b=GrapheneDMWDuckBridge(Path('/tmp/off.json'),mode='off')
          assert b.prompt_context()==''
          assert b.stagnation_reasons()==[]
          assert b.dead_action_reason([[0]], b.canonical_action([{'action':'ACTION1'}])) is None
          print('duck_baseline_mode=PASS')
          PY

      - name: Record integration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/arc-paper/duck-dmw-integration
          cp /tmp/duck_patch_manifest.json results/arc-paper/duck-dmw-integration/ 2>/dev/null || true
          cp arc_competition/UPSTREAM_MANIFEST.json results/arc-paper/duck-dmw-integration/
          printf '%s\n' \
            "head_sha=${{ github.event.pull_request.head.sha || github.sha }}" \
            'duck_commit=7652836056c59e044f093e3c13ed7438c814169e' \
            'qwen_model=vrfai/Qwen3.6-27B-FP8' \
            'packagable_variants=off,evidence' \
            'dialectic_variant=native-runtime-pending' \
            'evidence_mode_exact_noop_suppression=true' \
            'arc_game_execution=false' \
            > results/arc-paper/duck-dmw-integration/gate_identity.txt
          find results/arc-paper/duck-dmw-integration -type f -print0 | sort -z | xargs -0 sha256sum > results/arc-paper/duck-dmw-integration/SHA256SUMS.txt

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-paper-duck-dmw-integration-evidence
          path: results/arc-paper/duck-dmw-integration
          if-no-files-found: error
          retention-days: 30
