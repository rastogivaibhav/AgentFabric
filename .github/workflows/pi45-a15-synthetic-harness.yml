name: PI4.5 A1.5 Synthetic Dialectical Harness

# Development sanity harness only. ARC paper evidence now comes from controlled
# live comparisons; synthetic execution is deliberately manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout A1.5 branch
        uses: actions/checkout@v4

      - name: Assert no live ARC execution in harness
        shell: bash
        run: |
          set -euo pipefail
          for harness in pi45_a1/a15_synthetic_world_harness.py pi45_a1/a15_synthetic_world_harness_v2.py; do
            ! grep -Eq '(^|[[:space:]])(import|from)[[:space:]]+(arc_agi|arcengine)' "$harness"
            ! grep -q 'arc\.make\|get_environments\|env\.step\|Arcade(' "$harness"
          done
          ! grep -q 'a15_run_diagnostic.sh' pi45_a1/a15_run_synthetic_harness.sh
          grep -q 'platform_posix.cpp' pi45_a1/a15_run_synthetic_harness.sh
          echo 'synthetic_harness_arc_execution=ABSENT'
          echo 'modelworld_platform_linkage=PRESENT'

      - name: Run H0 plus Qwen-in-loop H1 synthetic harness
        shell: bash
        env:
          OUT_DIR: results/pi45a15-synthetic-harness
        run: bash pi45_a1/a15_run_synthetic_harness.sh "$OUT_DIR"

      - name: Record harness status and evidence hashes
        if: always()
        shell: bash
        env:
          OUT_DIR: results/pi45a15-synthetic-harness
        run: |
          mkdir -p "$OUT_DIR"
          printf '%s\n' \
            "job_status=${{ job.status }}" \
            "phase=development_synthetic_sanity" \
            "arc_game_execution=false" \
            "head_sha=${{ github.sha }}" \
            > "$OUT_DIR/job_status.txt"
          find "$OUT_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > "$OUT_DIR/SHA256SUMS.txt"

      - name: Upload synthetic harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi45a15-synthetic-harness-evidence
          path: results/pi45a15-synthetic-harness
          if-no-files-found: error
          retention-days: 30
