# Govagn — Production Compose Override
# ──────────────────────────────────────────────────────────────────────────────
# This file is a Docker Compose OVERRIDE.  Apply it on top of the base
# docker-compose.yml to harden a deployment for production traffic.
#
# Usage (from repo root):
#   docker compose \
#     -f docker-compose.yml \
#     -f deploy/docker/docker-compose.prod.yml \
#     up -d
#
# Or add to your Makefile:
#   make prod-up
#
# Required environment variables (fail-fast if missing):
#   GV_JWT_SECRET          — minimum 32-byte random secret
#   GV_ADMIN_PASSWORD      — strong admin password
#   GV_VAULT_KEY           — 64-char hex key for provider-key encryption
#   GV_CORS_ORIGINS        — your portal domain (e.g. https://app.govagn.io)
#   GV_GATEWAY_AUTH_TOKEN  — shared collector -> gateway ingest bearer token (same value on both services)
#   DATABASE_URL           — production PostgreSQL DSN with sslmode=require
#   REDIS_URL              — production Redis URL
#   POSTGRES_PASSWORD      — PostgreSQL superuser password (for the DB container)
#
# Optional but recommended:
#   GV_JWT_SECRETS         — comma-separated list for zero-downtime key rotation
#   GV_OIDC_ISSUER         — enable enterprise SSO
#   GV_TLS_ENABLED=true    — terminate TLS at the service layer (vs. load balancer)
#   GV_NETPROXY_CA_CERT_PATH / GV_NETPROXY_CA_KEY_PATH — persisted NetProxy CA files mounted into the container
#
# Generate all required secrets:
#   openssl rand -base64 32   # for GV_JWT_SECRET and GV_ADMIN_PASSWORD
#   openssl rand -base64 24   # for POSTGRES_PASSWORD
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL: enforce SSL, change default password ──────────────────────
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
    # Require SSL connections from all clients
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
        -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  # ─── Collector: enforce auth, disable debug, enable TLS ────────────────────
  collector:
    environment:
      GV_ENV: "production"
      GV_STRICT_CONFIG: "true"
      GV_AUTH_REQUIRE_AUTH: "true"          # Require JWT on all OTLP ingestion
      GV_JWT_SECRET: ${GV_JWT_SECRET:?GV_JWT_SECRET must be set for production}
      GV_DEBUG: "false"
      GV_TLS_ENABLED: "${GV_TLS_ENABLED:-false}"
      GV_GATEWAY_ENDPOINT: "http://api-gateway:8080"
      GV_GATEWAY_AUTH_TOKEN: ${GV_GATEWAY_AUTH_TOKEN:?GV_GATEWAY_AUTH_TOKEN must be set for production}
      # If GV_TLS_ENABLED=true, mount cert/key files and set GV_TLS_CERT_FILE + GV_TLS_KEY_FILE too.
      # Tighten rate limits for production load profile
      GV_RATE_LIMIT_SPANS_PER_SECOND: "${GV_RATE_LIMIT_SPANS_PER_SECOND:-10000}"
      GV_PROCESSOR_WORKERS: "${GV_PROCESSOR_WORKERS:-8}"
    restart: always

  # ─── API Gateway: enforce auth, lock CORS, require strong secrets ───────────
  api-gateway:
    environment:
      GV_AUTH_DISABLED: "false"             # JWT auth is MANDATORY in production
      GV_STRICT_CONFIG: "true"
      GV_JWT_SECRET: ${GV_JWT_SECRET:?GV_JWT_SECRET must be set for production}
      GV_JWT_SECRETS: "${GV_JWT_SECRETS:-}"
      GV_GATEWAY_AUTH_TOKEN: ${GV_GATEWAY_AUTH_TOKEN:?GV_GATEWAY_AUTH_TOKEN must be set for production}
      GV_ADMIN_PASSWORD: ${GV_ADMIN_PASSWORD:?GV_ADMIN_PASSWORD must be set for production}
      GV_VAULT_KEY: ${GV_VAULT_KEY:?GV_VAULT_KEY must be set for production}
      GV_ADMIN_USER: "${GV_ADMIN_USER:-admin}"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set for production}
      GV_CORS_ORIGINS: ${GV_CORS_ORIGINS:?GV_CORS_ORIGINS must be set for production}
      GV_NETPROXY_CA_CERT_FILE: "/run/govagn/netproxy-ca.crt"
      GV_NETPROXY_CA_KEY_FILE: "/run/govagn/netproxy-ca.key"
      GV_TLS_ENABLED: "${GV_TLS_ENABLED:-false}"
      # If GV_TLS_ENABLED=true, mount cert/key files and set GV_TLS_CERT_FILE + GV_TLS_KEY_FILE too.
      GV_LOG_LEVEL: "info"                  # Do not run debug logging in production
      # OIDC SSO — optional, uncomment to enable enterprise login.
      # If GV_SSO_REQUIRED=true, set issuer, client ID, client secret, and redirect URI together.
      # GV_OIDC_ISSUER:        "${GV_OIDC_ISSUER:-}"
      # GV_OIDC_CLIENT_ID:     "${GV_OIDC_CLIENT_ID:-}"
      # GV_OIDC_CLIENT_SECRET: "${GV_OIDC_CLIENT_SECRET:-}"
      # GV_OIDC_REDIRECT_URI:  "${GV_OIDC_REDIRECT_URI:-}"
      # GV_OIDC_LOGOUT_URL:    "${GV_OIDC_LOGOUT_URL:-}"  # optional provider logout redirect
      GV_PASSWORD_LOGIN_DISABLED: "${GV_PASSWORD_LOGIN_DISABLED:-false}"
      GV_SSO_REQUIRED: "${GV_SSO_REQUIRED:-false}"
    volumes:
      - ${GV_NETPROXY_CA_CERT_PATH:?GV_NETPROXY_CA_CERT_PATH must point to a persisted netproxy CA cert}:/run/govagn/netproxy-ca.crt:ro
      - ${GV_NETPROXY_CA_KEY_PATH:?GV_NETPROXY_CA_KEY_PATH must point to a persisted netproxy CA key}:/run/govagn/netproxy-ca.key:ro
    restart: always
  # ─── Portal: production build pointing at the live API ─────────────────────
  portal:
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL must be set for production}"
        VITE_WS_URL: "${VITE_WS_URL:?VITE_WS_URL must be set for production}" # Live stream is only complete behind a single api-gateway process today
        VITE_AUTH_DISABLED: "false"
        VITE_SHOW_DEFAULT_CREDS: "false"
    restart: always

  # ─── Grafana: disable anonymous access in production ───────────────────────
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: ""
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-CHANGE_ME_grafana}
      GF_SERVER_DOMAIN: "${GF_DOMAIN:-localhost}"

  postgres-backup:
    image: postgres:16
    profiles: ["backup"]
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for backups}
      BACKUP_FORMAT: "${BACKUP_FORMAT:-custom}"
      RETENTION_DAYS: "${RETENTION_DAYS:-7}"
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >
      pg_dump "$${DATABASE_URL}" --format="$${BACKUP_FORMAT}" --file="/backups/govagn-$$(date -u +%Y%m%dT%H%M%SZ).dump"
