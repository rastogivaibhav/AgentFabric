# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: govagn
  labels:
    app.kubernetes.io/name: govagn

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: govagn-config
  namespace: govagn
data:
  collector.yaml: |
    debug: false
    grpc:
      addr: ":4317"
    http:
      addr: ":4318"
    auth:
      require_auth: true
    rate_limit:
      spans_per_second: 100000
      burst_size: 20000
    processor:
      batch_size: 512
      batch_timeout_ms: 200
      max_queue_size: 500000
      workers: 8
      max_attribute_len: 4096
    pii:
      enabled: true
      redact: true
    discovery:
      enabled: true
      kubernetes_mode: true
      process_scan_seconds: 60

---
# ─── Secret ───────────────────────────────────────────────────────────────────
# Replace every REPLACE_* value before applying to a cluster.
# Generate secrets: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: govagn-secrets
  namespace: govagn
type: Opaque
stringData:
  jwt-secret:       "REPLACE_WITH_STRONG_SECRET_MIN_32_CHARS"
  jwt-secrets:      ""   # comma-separated for zero-downtime rotation (optional)
  admin-password:   "REPLACE_WITH_STRONG_ADMIN_PASSWORD"
  gateway-auth-token: "REPLACE_WITH_SHARED_INGEST_BEARER_TOKEN"
  vault-key:        "REPLACE_WITH_64_CHAR_HEX_KEY"
  oidc-client-secret: ""  # set when GV_SSO_REQUIRED=true
  database-url:     "postgres://fabric:REPLACE_PASSWORD@postgres-svc:5432/govagn?sslmode=require"
  redis-url:        "redis://:REPLACE_PASSWORD@redis-svc:6379"

---
# ─── Collector DaemonSet ──────────────────────────────────────────────────────
# Runs one pod per node for local-path OTLP ingestion (no network hop).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: govagn-collector
  namespace: govagn
  labels:
    app: govagn-collector
spec:
  selector:
    matchLabels:
      app: govagn-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: govagn-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: govagn-collector
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: ghcr.io/govagn/collector:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4317  # gRPC OTLP
              protocol: TCP
            - containerPort: 4318  # HTTP OTLP
              protocol: TCP
            - containerPort: 9090  # Prometheus
              protocol: TCP
          env:
            - name: GV_ENV
              value: "production"
            - name: GV_STRICT_CONFIG
              value: "true"
            - name: GV_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: jwt-secret
            - name: GV_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: gateway-auth-token
            - name: GV_GATEWAY_ENDPOINT
              value: "http://govagn-gateway-svc:8080"
          volumeMounts:
            - name: config
              mountPath: /etc/govagn
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4318
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4318
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: govagn-config

---
# ─── Collector Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: govagn-collector-svc
  namespace: govagn
spec:
  selector:
    app: govagn-collector
  type: ClusterIP
  clusterIP: None  # headless — SDKs hit the local node pod directly
  ports:
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: http-otlp
      port: 4318
      targetPort: 4318

---
# ─── API Gateway Deployment ───────────────────────────────────────────────────
# The REST control plane can scale horizontally, but /api/v1/stream/live uses
# a process-local WebSocket hub and is not a supported multi-replica HA path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: govagn-gateway
  namespace: govagn
spec:
  replicas: 3
  selector:
    matchLabels:
      app: govagn-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime: new pod must be ready before old is removed
  template:
    metadata:
      labels:
        app: govagn-gateway
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: govagn-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: ghcr.io/govagn/api-gateway:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: GV_ENV
              value: "production"
            - name: GV_STRICT_CONFIG
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: redis-url
            - name: GV_CORS_ORIGINS
              value: "https://app.govagn.io"
            - name: GV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: jwt-secret
            - name: GV_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: gateway-auth-token
            # GV_JWT_SECRETS: set for zero-downtime key rotation.
            # When empty the gateway falls back to GV_JWT_SECRET.
            - name: GV_JWT_SECRETS
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: jwt-secrets
            - name: GV_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: admin-password
            - name: GV_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: govagn-secrets
                  key: vault-key
            # Uncomment and populate these when enabling enterprise SSO.
            # GV_SSO_REQUIRED=true requires issuer, client ID, client secret, and redirect URI together.
            # - name: GV_SSO_REQUIRED
            #   value: "true"
            # - name: GV_PASSWORD_LOGIN_DISABLED
            #   value: "true"
            # - name: GV_OIDC_ISSUER
            #   value: "https://login.example.com/tenant/v2.0"
            # - name: GV_OIDC_CLIENT_ID
            #   value: "govagn-portal"
            # - name: GV_OIDC_CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: govagn-secrets
            #       key: oidc-client-secret
            # - name: GV_OIDC_REDIRECT_URI
            #   value: "https://app.govagn.io/auth/callback"
            # - name: GV_OIDC_LOGOUT_URL
            #   value: "https://login.example.com/logout"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

---
apiVersion: v1
kind: Service
metadata:
  name: govagn-gateway-svc
  namespace: govagn
spec:
  selector:
    app: govagn-gateway
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080

# ─── Portal Deployment ────────────────────────────────────────────────────────
# Nginx serving the pre-built React bundle.  Stateless — scale freely.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: govagn-portal
  namespace: govagn
  labels:
    app: govagn-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: govagn-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: govagn-portal
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: portal
          image: ghcr.io/govagn/portal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: false  # nginx worker needs port 80
            allowPrivilegeEscalation: false

---
apiVersion: v1
kind: Service
metadata:
  name: govagn-portal-svc
  namespace: govagn
spec:
  selector:
    app: govagn-portal
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80

---
# ─── RBAC for collector (K8s API discovery) ───────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: govagn-collector
  namespace: govagn

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: govagn-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: govagn-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: govagn-collector
subjects:
  - kind: ServiceAccount
    name: govagn-collector
    namespace: govagn

---
# ─── HorizontalPodAutoscaler ──────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: govagn-gateway-hpa
  namespace: govagn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: govagn-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

# ─── PodDisruptionBudgets ─────────────────────────────────────────────────────
# Ensure at least one pod of each critical service survives voluntary disruptions
# (node drains, rolling cluster upgrades).  Without PDBs, a multi-node drain
# can take all pods offline simultaneously.
#
# api-gateway: minAvailable:1 with 3 replicas → two pods can drain at once.
# This improves REST/API availability, but does not make /api/v1/stream/live
# replica-safe because live fan-out remains in-memory inside each pod.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: govagn-gateway-pdb
  namespace: govagn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: govagn-gateway

---
# collector (DaemonSet): minAvailable:1 prevents simultaneous drain of ALL nodes.
# This is most relevant in single-AZ clusters; multi-AZ clusters are inherently
# protected by zone topology, but the PDB is cheap insurance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: govagn-collector-pdb
  namespace: govagn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: govagn-collector
