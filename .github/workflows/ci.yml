name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  collector:
    name: collector (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: collector/go.sum
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...

  api-gateway:
    name: api-gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: govagn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: api-gateway/go.sum
      - name: Vet
        run: go vet ./...
      - name: Validate OpenAPI
        run: go test ./cmd/server -run 'TestOpenAPI|TestServeSwaggerUI|TestServeOpenAPISpec' -count=1
      - name: Tests
        env:
          DATABASE_URL: postgres://fabric:fabric@localhost:5432/govagn_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: go test ./...

  portal:
    name: portal (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  portal-e2e:
    name: portal (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke
        run: npm run test:e2e -- --project=chromium --reporter=list

  agent-sdk:
    name: agent-sdk (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -v

  helm-smoke:
    name: Helm Chart Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"
      - name: Helm lint
        run: helm lint deploy/helm
      - name: Helm template
        run: |
          helm template govagn deploy/helm \
            --set collector.image.tag=ci \
            --set api.image.tag=ci \
            --set portal.image.tag=ci \
            | grep -q "^kind:"
      - name: Helm install dry-run
        run: |
          helm install govagn-smoke deploy/helm \
            --dry-run \
            --generate-name \
            --set collector.image.tag=ci \
            --set api.image.tag=ci \
            --set portal.image.tag=ci

  packaging-smoke:
    name: Packaging Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config (local)
        run: docker compose -f docker-compose.yml config > /dev/null
      - name: Compose config (production overlay)
        run: docker compose -f docker-compose.yml -f deploy/docker/docker-compose.prod.yml --env-file deploy/docker/.env.production.example config > /dev/null
      - name: Assert release assets exist
        run: |
          test -f scripts/setup-local.sh
          test -f scripts/bootstrap_local.ps1
          test -f scripts/seed-demo-data.sh
          test -f scripts/seed-demo-data.ps1
          test -f scripts/exercise-netproxy-ca-backup-restore.sh
          test -f scripts/exercise_netproxy_ca_backup_restore.ps1
          test -f scripts/run-production-deployment-validation.sh
          test -f scripts/run_production_deployment_validation.ps1
          test -f scripts/run-release-candidate-validation.sh
          test -f scripts/run_release_candidate_validation.ps1
          test -f scripts/run-ga-gate.sh
          test -f scripts/run_ga_gate.ps1

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  ga-gate-smoke:
    name: Release Evidence Summary (CI Mode)
    needs: [collector, api-gateway, portal, portal-e2e, agent-sdk, helm-smoke, packaging-smoke, secret-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Run GA gate in CI mode
        env:
          GA_GATE_MODE: ci
          GA_COLLECTOR_RESULT: ${{ needs.collector.result }}
          GA_GATEWAY_RESULT: ${{ needs.api-gateway.result }}
          GA_PORTAL_RESULT: ${{ needs.portal.result }}
          GA_PORTAL_E2E_RESULT: ${{ needs.portal-e2e.result }}
          GA_SDK_RESULT: ${{ needs.agent-sdk.result }}
          GA_HELM_RESULT: ${{ needs.helm-smoke.result }}
          GA_PACKAGING_RESULT: ${{ needs.packaging-smoke.result }}
          GA_SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: bash scripts/run-ga-gate.sh

  ci-gate:
    name: CI Gate
    needs: [collector, api-gateway, portal, portal-e2e, agent-sdk, helm-smoke, packaging-smoke, secret-scan, ga-gate-smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          COLLECTOR_RESULT: ${{ needs.collector.result }}
          GATEWAY_RESULT: ${{ needs.api-gateway.result }}
          PORTAL_RESULT: ${{ needs.portal.result }}
          PORTAL_E2E_RESULT: ${{ needs.portal-e2e.result }}
          SDK_RESULT: ${{ needs.agent-sdk.result }}
          HELM_RESULT: ${{ needs.helm-smoke.result }}
          PACKAGING_RESULT: ${{ needs.packaging-smoke.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          GA_GATE_RESULT: ${{ needs.ga-gate-smoke.result }}
        run: |
          FAILED=0
          for JOB in "$COLLECTOR_RESULT" "$GATEWAY_RESULT" "$PORTAL_RESULT" "$PORTAL_E2E_RESULT" "$SDK_RESULT" "$HELM_RESULT" "$PACKAGING_RESULT" "$SECRET_SCAN_RESULT" "$GA_GATE_RESULT"; do
            if [ "$JOB" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "One or more CI jobs failed. Merge blocked."
            exit 1
          fi
          echo "All CI jobs passed. Merge allowed."
