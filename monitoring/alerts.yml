groups:
  - name: agentfabric.service_health
    interval: 30s
    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AgentFabric service {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for more than 1 minute."
          runbook: "https://docs.agentfabric.io/runbooks/service-down"

      - alert: CollectorNotReceivingSpans
        expr: rate(agentfabric_spans_received_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector has not received any spans in 5 minutes"
          description: "No OTLP spans have been received. Check that instrumented agents are running and pointing at the collector."
          runbook: "https://docs.agentfabric.io/runbooks/no-spans"

      - alert: HighProcessorQueueDepth
        expr: agentfabric_processor_queue_depth > 50000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Span processor queue depth is high ({{ $value }})"
          description: "The collector's internal queue exceeds 50K pending spans. This may indicate downstream congestion to api-gateway."
          runbook: "https://docs.agentfabric.io/runbooks/queue-depth"

  - name: agentfabric.api_gateway
    interval: 30s
    rules:

      - alert: HighErrorRate
        expr: |
          (
            rate(agentfabric_http_requests_total{status=~"5.."}[5m])
            /
            rate(agentfabric_http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway error rate is {{ $value | humanizePercentage }}"
          description: "More than 5% of HTTP requests to the api-gateway are returning 5xx errors over the last 5 minutes."
          runbook: "https://docs.agentfabric.io/runbooks/high-error-rate"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            rate(agentfabric_http_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API Gateway P95 latency is {{ $value | humanizeDuration }}"
          description: "P95 request latency has exceeded 2 seconds for 5 minutes. Check database query performance and connection pool."
          runbook: "https://docs.agentfabric.io/runbooks/high-latency"

      - alert: HighRateLimitRate
        expr: rate(agentfabric_http_requests_total{status="429"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate-limit rejections: {{ $value }} req/s"
          description: "More than 10 requests/second are being rate-limited (429). A tenant may be exceeding their quota."
          runbook: "https://docs.agentfabric.io/runbooks/rate-limiting"

  - name: agentfabric.audit_chain
    interval: 1m
    rules:

      - alert: AuditChainMultipleReplicas
        expr: kube_deployment_spec_replicas{deployment=~".*af-core.*"} > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "af-core is running {{ $value }} replicas — audit chain integrity at risk"
          description: |
            af-core's AuditWriter stores the last-known hash in process memory (Mutex<String>).
            Running more than one replica produces independent diverged chains, breaking
            tamper-evidence. Scale back to 1 replica immediately and investigate.
            This constraint will be lifted in v1.2.0 (PostgreSQL-backed chain).
          runbook: "https://docs.agentfabric.io/runbooks/audit-chain-single-replica"

  - name: agentfabric.cost
    interval: 1m
    rules:

      - alert: UnexpectedCostSpike
        expr: |
          rate(agentfabric_cost_usd_total[1h]) * 3600 > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hourly AI cost projection exceeds $100"
          description: "Current spend rate would result in > $100/hour. Verify no runaway agents are active."
          runbook: "https://docs.agentfabric.io/runbooks/cost-spike"
