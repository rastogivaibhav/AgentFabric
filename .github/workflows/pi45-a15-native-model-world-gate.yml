name: PI4.5 A1.5 Native ModelWorld Gate

on:
  workflow_dispatch:
  push:
    branches:
      - pi45-a15-dialectical-model-world-20260821
    paths:
      - 'pi45_a1/a15_native_model_world/**'
      - 'pi45_a1/a15_native_model_world_proof.sh'
      - '.github/workflows/pi45-a15-native-model-world-gate.yml'

permissions:
  contents: read

jobs:
  native-model-world:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove vendored source identity and native ModelWorld semantics
        run: bash pi45_a1/a15_native_model_world_proof.sh /tmp/a15-native-model-world-evidence
      - name: Record commit
        run: printf '%s\n' "${GITHUB_SHA}" > /tmp/a15-native-model-world-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pi45-a15-native-model-world-evidence
          path: /tmp/a15-native-model-world-evidence
          if-no-files-found: error
          retention-days: 14
