name: Graphene Chess Selection Causality P4.2

on:
  push:
    branches: [arc-paper-dmw-duck-20260821]
    paths:
      - 'arc_competition/build_chess_counterfactual_native_helper_p42.sh'
      - 'arc_competition/graphene_chess_selection_causality_p4.py'
      - 'arc_competition/chess_counterfactual_plugin.py'
      - 'arc_competition/chess_counterfactual_plugin_v2.py'
      - 'arc_competition/chess_rules.json'
      - '.github/workflows/graphene-chess-selection-causality-p42.yml'
  pull_request:
    branches: [pi45-a15-dialectical-model-world-20260821]
    paths:
      - 'arc_competition/build_chess_counterfactual_native_helper_p42.sh'
      - 'arc_competition/graphene_chess_selection_causality_p4.py'
      - '.github/workflows/graphene-chess-selection-causality-p42.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p42-selection-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Build native runtime and expanded-budget plugin helper
        run: |
          set -euo pipefail
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_chess_counterfactual_native_helper_p42.sh /tmp/chess_counterfactual_native_helper_p42
      - name: Run same 20 deterministic candidate-order permutations
        env:
          PYTHONPATH: pi45_a1:arc_competition
        run: |
          set -uo pipefail
          rm -rf /tmp/graphene-chess-p42 /tmp/graphene_chess_p42.seed-*.graphenedb*
          mkdir -p /tmp/graphene-chess-p42
          set +e
          python3 arc_competition/graphene_chess_selection_causality_p4.py \
            --native-helper /tmp/chess_counterfactual_native_helper_p42 \
            --bootstrap /tmp/a15_graphene_bootstrap \
            --db-prefix /tmp/graphene_chess_p42 \
            --rules arc_competition/chess_rules.json \
            --runs 20 \
            --out /tmp/graphene-chess-p42 | tee /tmp/graphene-chess-p42/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/graphene-chess-p42/process_exit_code.txt
          exit "$rc"
      - name: Record evidence identity
        if: always()
        run: |
          mkdir -p /tmp/graphene-chess-p42
          printf '%s\n' \
            "agentfabric_commit=${GITHUB_SHA}" \
            'experiment=GCDT-P4.2-selection-causality' \
            'permutations=20' \
            'query_mode=Theoretical' \
            'max_paths=512' \
            'max_visited_states=4096' \
            'max_paths_per_root=64' \
            'core_graphenedb_modified=false' \
            'core_hypokosh_modified=false' \
            'stockfish=false' \
            'opening_book=false' \
            'llm_move_selector=false' \
            > /tmp/graphene-chess-p42/experiment_identity.txt
          find /tmp/graphene-chess-p42 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-chess-p42/SHA256SUMS.txt
      - name: Upload P4.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-chess-selection-causality-p42-evidence
          path: /tmp/graphene-chess-p42
          if-no-files-found: error
          retention-days: 30
