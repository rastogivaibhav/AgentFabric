global:
  image:
    pullPolicy: IfNotPresent
  environment: "production"
  namespace: ""

collector:
  enabled: true
  image:
    repository: ghcr.io/govagn/collector
    tag: "1.0.0"
  env:
    GV_PROCESSOR_WORKERS: "4"
    GV_RATE_LIMIT_SPANS_PER_SECOND: "10000"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

api:
  enabled: true
  image:
    repository: ghcr.io/govagn/api-gateway
    tag: "1.0.0"
  # Horizontal API scaling is supported for the REST control plane, but
  # /api/v1/stream/live uses a process-local hub and is not replica-safe.
  replicas: 2
  service:
    port: 8080
  cors:
    allowedOrigins:
      - "https://app.govagn.io"
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: api.govagn.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: govagn-api-tls
        hosts:
          - api.govagn.io
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

portal:
  enabled: true
  image:
    repository: ghcr.io/govagn/portal
    tag: "1.0.0"
  replicas: 2
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: app.govagn.io
    tls:
      - secretName: govagn-portal-tls
        hosts:
          - app.govagn.io
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

secrets:
  name: govagn-secrets

auth:
  ssoRequired: false
  passwordLoginDisabled: false
  oidc:
    issuer: ""
    clientId: ""
    clientSecretKey: "oidc-client-secret"
    redirectUri: ""
    logoutUrl: ""

networkPolicy:
  enabled: true
  allowSameNamespace: true
  allowIngressCIDRs: []
  allowEgressCIDRs: []

backups:
  enabled: false
  schedule: "0 */6 * * *"
  retentionDays: 7
  image:
    repository: postgres
    tag: "16"
  pvc:
    enabled: false
    existingClaim: ""
    size: 20Gi
  export:
    format: custom
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

certManager:
  enabled: false
  email: ""
  issuer:
    create: true
    name: govagn-letsencrypt
    kind: ClusterIssuer
    server: https://acme-v02.api.letsencrypt.org/directory

monitoring:
  dashboards:
    enabled: true
  grafanaNamespace: monitoring
