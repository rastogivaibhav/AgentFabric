name: Graphene Chess Selection Causality P4

on:
  push:
    branches: [arc-paper-dmw-duck-20260821]
    paths:
      - 'arc_competition/graphene_chess_selection_causality_p4.py'
      - 'arc_competition/chess_counterfactual_plugin_v2.py'
      - 'arc_competition/build_chess_counterfactual_native_helper.sh'
      - 'arc_competition/graphene_chess_basic.py'
      - 'arc_competition/chess_rules.json'
      - '.github/workflows/graphene-chess-selection-causality-p4.yml'
  pull_request:
    branches: [pi45-a15-dialectical-model-world-20260821]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-selection-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Build unchanged native runtime and plugin helper
        run: |
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_chess_counterfactual_native_helper.sh /tmp/chess_counterfactual_native_helper
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot pi45_a1/a15_native_runtime_helper.cpp
      - name: Run 20 deterministic candidate-order permutations
        env:
          PYTHONPATH: pi45_a1:arc_competition
        run: |
          rm -rf /tmp/graphene-chess-p4 /tmp/graphene_chess_p4.seed-*.graphenedb*
          mkdir -p /tmp/graphene-chess-p4
          set +e
          python3 arc_competition/graphene_chess_selection_causality_p4.py \
            --native-helper /tmp/chess_counterfactual_native_helper \
            --bootstrap /tmp/a15_graphene_bootstrap \
            --db-prefix /tmp/graphene_chess_p4 \
            --rules arc_competition/chess_rules.json \
            --runs 20 \
            --out /tmp/graphene-chess-p4 | tee /tmp/graphene-chess-p4/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/graphene-chess-p4/process_exit_code.txt
          exit "$rc"
      - name: Record evidence identity
        if: always()
        run: |
          printf '%s\n' \
            "agentfabric_commit=${GITHUB_SHA}" \
            'experiment=GCDT-P4-selection-causality' \
            'permutations=20' \
            'core_graphenedb_modified=false' \
            'core_hypokosh_modified=false' \
            'stockfish=false' \
            'opening_book=false' \
            'llm_move_selector=false' \
            > /tmp/graphene-chess-p4/experiment_identity.txt
          find /tmp/graphene-chess-p4 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-chess-p4/SHA256SUMS.txt
      - name: Upload P4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-chess-selection-causality-p4-evidence
          path: /tmp/graphene-chess-p4
          if-no-files-found: error
          retention-days: 30
