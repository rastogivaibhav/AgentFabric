name: Graphene Chess Selection Causality P4.3
on:
  pull_request:
    paths:
      - 'arc_competition/chess_counterfactual_plugin_v4.py'
      - 'arc_competition/graphene_chess_selection_causality_p43.py'
      - 'arc_competition/chess_rules.json'
      - 'arc_competition/build_chess_counterfactual_native_helper_p42.sh'
      - '.github/workflows/graphene-chess-selection-causality-p43.yml'
  workflow_dispatch:
jobs:
  p43-selection-causality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Build native runtime and expanded-budget plugin helper
        run: |
          set -euo pipefail
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_chess_counterfactual_native_helper_p42.sh /tmp/chess_counterfactual_native_helper_p43
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot pi45_a1/a15_native_runtime_helper.cpp
      - name: Run 20 direct-fiber candidate-order permutations
        env:
          PYTHONPATH: pi45_a1:arc_competition
        run: |
          set -uo pipefail
          rm -rf /tmp/graphene-chess-p43 /tmp/graphene_chess_p43.seed-*.graphenedb*
          mkdir -p /tmp/graphene-chess-p43
          set +e
          python3 arc_competition/graphene_chess_selection_causality_p43.py \
            --native-helper /tmp/chess_counterfactual_native_helper_p43 \
            --bootstrap /tmp/a15_graphene_bootstrap \
            --db-prefix /tmp/graphene_chess_p43 \
            --rules arc_competition/chess_rules.json \
            --runs 20 \
            --out /tmp/graphene-chess-p43 | tee /tmp/graphene-chess-p43/run.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/graphene-chess-p43/process_exit_code.txt
          exit "$rc"
      - name: Record evidence identity
        if: always()
        run: |
          mkdir -p /tmp/graphene-chess-p43
          printf '%s\n' \
            "agentfabric_commit=${GITHUB_SHA}" \
            'experiment=GCDT-P4.3-direct-evidence-fibers' \
            'permutations=20' \
            'core_graphenedb_modified=false' \
            'core_hypokosh_modified=false' \
            'stockfish=false' \
            'opening_book=false' \
            'llm_move_selector=false' \
            > /tmp/graphene-chess-p43/experiment_identity.txt
          find /tmp/graphene-chess-p43 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-chess-p43/SHA256SUMS.txt
      - name: Upload P4.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-chess-selection-causality-p43-evidence
          path: /tmp/graphene-chess-p43
          if-no-files-found: error
          retention-days: 30
