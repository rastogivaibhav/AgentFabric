name: Graphene Chess Counterfactual Plugin v2

on:
  push:
    branches: [arc-paper-dmw-duck-20260821]
    paths:
      - 'arc_competition/chess_counterfactual_plugin.py'
      - 'arc_competition/chess_counterfactual_plugin_v2.py'
      - 'arc_competition/test_chess_counterfactual_plugin_v2.py'
      - 'arc_competition/graphene_chess_counterfactual_v2.py'
      - 'arc_competition/build_chess_counterfactual_native_helper.sh'
      - 'arc_competition/graphene_chess_basic.py'
      - 'arc_competition/chess_rules.json'
      - 'arc_competition/graphene_modelworld_dump.cpp'
      - '.github/workflows/graphene-chess-counterfactual-plugin-v2.yml'
  pull_request:
    branches: [pi45-a15-dialectical-model-world-20260821]
    paths:
      - 'arc_competition/chess_counterfactual_plugin_v2.py'
      - 'arc_competition/test_chess_counterfactual_plugin_v2.py'
      - 'arc_competition/graphene_chess_counterfactual_v2.py'
      - 'arc_competition/build_chess_counterfactual_native_helper.sh'
      - '.github/workflows/graphene-chess-counterfactual-plugin-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-v2-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install chess transition library
        run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Prove v2 plugin graph contract and isolation
        env:
          PYTHONPATH: arc_competition
        run: |
          set -euo pipefail
          python3 -m py_compile \
            arc_competition/chess_counterfactual_plugin.py \
            arc_competition/chess_counterfactual_plugin_v2.py \
            arc_competition/test_chess_counterfactual_plugin_v2.py \
            arc_competition/graphene_chess_counterfactual_v2.py
          python3 -m unittest -v arc_competition/test_chess_counterfactual_plugin_v2.py
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot
          printf '%s\n' 'core_graphenedb_modified=false' 'core_hypokosh_modified=false'

  native-v2-integration:
    needs: plugin-v2-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install chess transition library
        run: python3 -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Build unchanged native runtime proof and bootstrap
        run: bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
      - name: Build plugin-only Theoretical helper
        run: bash arc_competition/build_chess_counterfactual_native_helper.sh /tmp/chess_counterfactual_native_helper
      - name: Prove repository core/helper sources remain unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            pi45_a1/a15_native_runtime \
            pi45_a1/graphenedb_snapshot \
            pi45_a1/a15_native_runtime_helper.cpp
      - name: Build ModelWorld dump helper
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 \
            -Ipi45_a1/a15_native_runtime/include \
            -Ipi45_a1/a15_native_model_world/include \
            -Ipi45_a1/graphenedb_snapshot/include \
            arc_competition/graphene_modelworld_dump.cpp \
            pi45_a1/a15_native_model_world/src/model_world.cpp \
            pi45_a1/graphenedb_snapshot/src/platform_posix.cpp \
            -pthread -o /tmp/graphene_modelworld_dump
      - name: Run plugin-v2 enriched 4 White + 4 Black moves
        env:
          PYTHONPATH: pi45_a1:arc_competition
        run: |
          set -uo pipefail
          rm -rf /tmp/graphene_chess_plugin_v2.graphenedb /tmp/graphene_chess_plugin_v2.graphenedb.modelworld /tmp/graphene-chess-plugin-v2
          mkdir -p /tmp/graphene-chess-plugin-v2
          /tmp/a15_graphene_bootstrap /tmp/graphene_chess_plugin_v2.graphenedb
          set +e
          python3 arc_competition/graphene_chess_counterfactual_v2.py \
            --native-helper /tmp/chess_counterfactual_native_helper \
            --db /tmp/graphene_chess_plugin_v2.graphenedb \
            --rules arc_competition/chess_rules.json \
            --plies 8 \
            --out /tmp/graphene-chess-plugin-v2 2>&1 | tee /tmp/graphene-chess-plugin-v2/run.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f /tmp/graphene_chess_plugin_v2.graphenedb.modelworld ]; then
            /tmp/graphene_modelworld_dump /tmp/graphene_chess_plugin_v2.graphenedb.modelworld \
              > /tmp/graphene-chess-plugin-v2/modelworld_epistemic_snapshot.json
          fi
          printf '%s\n' "$rc" > /tmp/graphene-chess-plugin-v2/chess_process_exit_code.txt
          exit "$rc"
      - name: Assert native v2 integration success
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/graphene-chess-plugin-v2')
          s=json.loads((p/'summary.json').read_text())
          assert s['plugin']=='chess-counterfactual-fiber-adapter-v2', s
          assert s['required_query_mode']=='Theoretical', s
          assert s['core_graphenedb_modified'] is False, s
          assert s['core_hypokosh_modified'] is False, s
          assert s['plugin_selected_move'] is False, s
          assert s['completed_plies']==8, s
          assert s['all_moves_legal'] is True, s
          for i in range(1,9):
              row=json.loads((p/f'ply_{i:02d}.json').read_text())
              assert row['primary_node'] not in (None,0), row
              assert row['primary_hypothesis_id'].startswith(f'ply-{i-1}-move-'), row
              assert row['selected_hypothesis_id']==row['primary_hypothesis_id'], row
              assert float(row['confidence']) > 0.0, row
              plugin=json.loads((p/f'ply_{i:02d}_plugin.json').read_text())
              assert plugin['selected_move'] is None, plugin
              assert plugin['ranked_moves'] is None, plugin
              assert plugin['candidate_count'] > 1, plugin
              receipt=row['reasoning_receipt']
              assert receipt.get('fiber_bundle_built') is True, receipt
              assert receipt.get('convergence_executed') is True, receipt
          print('graphene_chess_counterfactual_plugin_v2=PASS')
          PY
      - name: Record v2 evidence identity and digests
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/graphene-chess-plugin-v2
          printf '%s\n' \
            "agentfabric_commit=${GITHUB_SHA}" \
            'plugin=chess-counterfactual-fiber-adapter-v2' \
            'query_mode=Theoretical' \
            'retrieval_focus=current_turn_comparison_anchor' \
            'retrieval_turn_isolation=true' \
            'core_graphenedb_modified=false' \
            'core_hypokosh_modified=false' \
            'generic_a15_helper_modified=false' \
            'stockfish=false' \
            'opening_book=false' \
            'llm_move_selector=false' \
            > /tmp/graphene-chess-plugin-v2/experiment_identity.txt
          find /tmp/graphene-chess-plugin-v2 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > /tmp/graphene-chess-plugin-v2/SHA256SUMS.txt
      - name: Upload v2 plugin experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphene-chess-counterfactual-plugin-v2-evidence
          path: /tmp/graphene-chess-plugin-v2
          if-no-files-found: error
          retention-days: 30
