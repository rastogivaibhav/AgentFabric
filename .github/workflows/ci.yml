name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

# Coverage gate: PRs blocked if any service drops below 90% (Sprint 4 gate — all services)
# Next milestone: v1.0.0 GA release.

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ─── af-core (Rust) ─────────────────────────────────────────────────────────
  af-core:
    name: af-core (Rust)
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.coverage-gate.outputs.pct }}
    defaults:
      run:
        working-directory: af-core

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: agentfabric_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            af-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('af-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Clippy (zero warnings)
        run: cargo clippy -- -D warnings

      - name: Tests + coverage
        env:
          DATABASE_URL: postgres://fabric:fabric@localhost:5432/agentfabric_test
          TEST_DATABASE_URL: postgres://fabric:fabric@localhost:5432/agentfabric_test
        run: |
          cargo tarpaulin \
            --out Xml \
            --output-dir coverage \
            --exclude-files "src/main.rs" \
            --timeout 120

      - name: Enforce coverage gate (90% Sprint 4)
        id: coverage-gate
        run: |
          COVERAGE=$(cargo tarpaulin --out Stdout 2>&1 | grep -oP '\d+\.\d+(?=% coverage)' | head -1)
          echo "af-core coverage: ${COVERAGE}%"
          echo "pct=${COVERAGE}" >> $GITHUB_OUTPUT
          python3 -c "
          import sys
          cov = float('${COVERAGE}' or '0')
          if cov < 90.0:
              print(f'Coverage {cov}% is below 90% gate')
              sys.exit(1)
          print(f'Coverage {cov}% passes 90% gate')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: af-core/coverage/cobertura.xml
          flags: af-core
          fail_ci_if_error: false

  # ─── collector (Go) ─────────────────────────────────────────────────────────
  collector:
    name: collector (Go)
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.coverage-gate.outputs.pct }}
    defaults:
      run:
        working-directory: collector

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: collector/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests + coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage_report.txt

      - name: Enforce coverage gate (90% Sprint 4)
        id: coverage-gate
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "collector coverage: ${TOTAL}%"
          echo "pct=${TOTAL}" >> $GITHUB_OUTPUT
          python3 -c "
          import sys
          cov = float('${TOTAL}' or '0')
          if cov < 90.0:
              print(f'Coverage {cov}% is below 90% gate')
              sys.exit(1)
          print(f'Coverage {cov}% passes 90% gate')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: collector/coverage.out
          flags: collector
          fail_ci_if_error: false

  # ─── api-gateway (Go) ───────────────────────────────────────────────────────
  api-gateway:
    name: api-gateway (Go)
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.coverage-gate.outputs.pct }}
    defaults:
      run:
        working-directory: api-gateway

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: agentfabric_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: api-gateway/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests + coverage
        env:
          DATABASE_URL: postgres://fabric:fabric@localhost:5432/agentfabric_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage_report.txt

      - name: Enforce coverage gate (90% Sprint 4)
        id: coverage-gate
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "api-gateway coverage: ${TOTAL}%"
          echo "pct=${TOTAL}" >> $GITHUB_OUTPUT
          python3 -c "
          import sys
          cov = float('${TOTAL}' or '0')
          if cov < 90.0:
              print(f'Coverage {cov}% is below 90% gate')
              sys.exit(1)
          print(f'Coverage {cov}% passes 90% gate')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: api-gateway/coverage.out
          flags: api-gateway
          fail_ci_if_error: false

  # ─── portal (TypeScript/React) ──────────────────────────────────────────────
  portal:
    name: portal (TypeScript)
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.coverage-gate.outputs.pct }}
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests + coverage
        run: npx vitest run --coverage

      - name: Enforce coverage gate (90% Sprint 4)
        id: coverage-gate
        run: |
          TOTAL=$(node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const lines = summary.total.lines.pct;
            console.log(lines);
          ")
          echo "portal coverage: ${TOTAL}%"
          echo "pct=${TOTAL}" >> $GITHUB_OUTPUT
          python3 -c "
          import sys
          cov = float('${TOTAL}' or '0')
          if cov < 90.0:
              print(f'Coverage {cov}% is below 90% gate')
              sys.exit(1)
          print(f'Coverage {cov}% passes 90% gate')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: portal/coverage/coverage-final.json
          flags: portal
          fail_ci_if_error: false

  # ─── agent-sdk (Python) ─────────────────────────────────────────────────────
  agent-sdk:
    name: agent-sdk (Python)
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.coverage-gate.outputs.pct }}
    defaults:
      run:
        working-directory: agent-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Tests + coverage
        run: |
          pytest --cov=agentfabric \
                 --cov-report=xml:coverage.xml \
                 --cov-report=term-missing \
                 --cov-report=json:coverage.json \
                 -v

      - name: Enforce coverage gate (90% Sprint 4)
        id: coverage-gate
        run: |
          TOTAL=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('coverage.json'))
              pct = data['totals']['percent_covered']
              print(f'{pct:.1f}')
          except Exception as e:
              print('0')
          ")
          echo "agent-sdk coverage: ${TOTAL}%"
          echo "pct=${TOTAL}" >> $GITHUB_OUTPUT
          python3 -c "
          import sys
          cov = float('${TOTAL}' or '0')
          if cov < 90.0:
              print(f'Coverage {cov}% is below 90% gate')
              sys.exit(1)
          print(f'Coverage {cov}% passes 90% gate')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: agent-sdk/coverage.xml
          flags: agent-sdk
          fail_ci_if_error: false

  # ─── Coverage PR comment ────────────────────────────────────────────────────
  # Posts (or updates) a single sticky comment on every PR with a per-service
  # coverage table.  Skipped on direct pushes (not a PR).
  coverage-comment:
    name: Coverage Report (PR Comment)
    needs: [af-core, collector, api-gateway, portal, agent-sdk]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Post coverage table
        uses: actions/github-script@v7
        with:
          script: |
            const services = [
              { name: 'af-core',      pct: '${{ needs.af-core.outputs.coverage_pct }}' },
              { name: 'collector',    pct: '${{ needs.collector.outputs.coverage_pct }}' },
              { name: 'api-gateway',  pct: '${{ needs.api-gateway.outputs.coverage_pct }}' },
              { name: 'portal',       pct: '${{ needs.portal.outputs.coverage_pct }}' },
              { name: 'agent-sdk',    pct: '${{ needs.agent-sdk.outputs.coverage_pct }}' },
            ];

            const rows = services.map(({ name, pct }) => {
              const n = parseFloat(pct) || 0;
              const icon = n >= 90 ? '✅' : '❌';
              const gate = n >= 90 ? 'PASS' : `**FAIL** (${90 - n > 0 ? (90 - n).toFixed(1) : 0}% below gate)`;
              return `| ${name} | ${icon} ${pct}% | ${gate} |`;
            }).join('\n');

            const allPass = services.every(({ pct }) => parseFloat(pct) >= 90);
            const header = allPass
              ? '## ✅ Coverage Report — All services pass 90% gate'
              : '## ❌ Coverage Report — One or more services below 90% gate';

            const body = [
              header,
              '',
              '| Service | Coverage | Gate (90%) |',
              '|---------|----------|-----------|',
              rows,
              '',
              '_Coverage gate: 90% lines. Updated on every commit._',
            ].join('\n');

            // Update existing bot comment if present, otherwise create new one
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Coverage Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ─── Helm chart smoke test (v1.0.0 GA) ──────────────────────────────────────
  helm-smoke:
    name: Helm Chart Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm lint
        run: helm lint deploy/helm

      - name: Helm template (dry-run render)
        run: |
          helm template agentfabric deploy/helm \
            --set collector.image.tag=ci \
            --set afCore.image.tag=ci \
            --set apiGateway.image.tag=ci \
            --set portal.image.tag=ci \
            | grep -c "^kind:" \
            | xargs -I {} sh -c '
              echo "Rendered {} Kubernetes resources"
              [ "{}" -ge 10 ] || (echo "Expected ≥10 resources, got {}" && exit 1)
            '

      - name: Helm install dry-run
        run: |
          helm install agentfabric-smoke deploy/helm \
            --dry-run \
            --generate-name \
            --set collector.image.tag=ci \
            --set afCore.image.tag=ci \
            --set apiGateway.image.tag=ci \
            --set portal.image.tag=ci

  # ─── Secret scanning ─────────────────────────────────────────────────────────
  # Blocks merge if Gitleaks detects high-entropy secrets, API keys, or the
  # known dev-secret sentinel in any non-test source file.
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — Gitleaks checks all commits on the PR branch

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for private org repos; leave unset for public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Belt-and-braces: assert the known dev-secret sentinel is not in any
      # production source path (env defaults, docker configs, Go source).
      # Test files are explicitly excluded so the sentinel may appear in test fixtures.
      - name: Assert dev sentinel absent from production source
        env:
          SENTINEL: "dev-secret-change-in-production"
        run: |
          HITS=$(grep -rn "$SENTINEL" \
            --include="*.go" --include="*.yml" --include="*.yaml" --include="*.env" \
            --exclude="*_test.go" \
            --exclude-dir=".git" \
            . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Dev-secret sentinel found in production source files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK — dev sentinel not present in production source paths."

  # ─── PR gate: all jobs must pass ────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs: [af-core, collector, api-gateway, portal, agent-sdk, helm-smoke, secret-scan, coverage-comment]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          AF_CORE_RESULT: ${{ needs.af-core.result }}
          COLLECTOR_RESULT: ${{ needs.collector.result }}
          GATEWAY_RESULT: ${{ needs.api-gateway.result }}
          PORTAL_RESULT: ${{ needs.portal.result }}
          SDK_RESULT: ${{ needs.agent-sdk.result }}
          HELM_RESULT: ${{ needs.helm-smoke.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          COVERAGE_COMMENT_RESULT: ${{ needs.coverage-comment.result }}
        run: |
          FAILED=0
          # coverage-comment is skipped on non-PR pushes — treat skipped as passing
          for JOB in "$AF_CORE_RESULT" "$COLLECTOR_RESULT" "$GATEWAY_RESULT" "$PORTAL_RESULT" "$SDK_RESULT" "$HELM_RESULT" "$SECRET_SCAN_RESULT"; do
            if [ "$JOB" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "$COVERAGE_COMMENT_RESULT" != "success" ] && [ "$COVERAGE_COMMENT_RESULT" != "skipped" ]; then
            echo "Warning: coverage-comment job did not succeed (result: $COVERAGE_COMMENT_RESULT)"
          fi
          if [ "$FAILED" = "1" ]; then
            echo "One or more CI jobs failed. Merge blocked."
            exit 1
          fi
          echo "All CI jobs passed. Merge allowed."
