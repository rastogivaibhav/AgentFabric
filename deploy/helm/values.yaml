global:
  image:
    pullPolicy: IfNotPresent
  environment: "production"

collector:
  enabled: true
  image:
    repository: ghcr.io/agentfabric/collector
    tag: "1.0.0"
  env:
    AF_PROCESSOR_WORKERS: "4"
    AF_RATE_LIMIT_SPANS_PER_SECOND: "10000"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

api:
  enabled: true
  image:
    repository: ghcr.io/agentfabric/api-gateway
    tag: "1.0.0"
  replicas: 2
  service:
    port: 8080
  cors:
    allowedOrigins:
      - "https://app.agentfabric.io"
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: api.agentfabric.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: agentfabric-api-tls
        hosts:
          - api.agentfabric.io
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

portal:
  enabled: true
  image:
    repository: ghcr.io/agentfabric/portal
    tag: "1.0.0"
  replicas: 2
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: app.agentfabric.io
    tls:
      - secretName: agentfabric-portal-tls
        hosts:
          - app.agentfabric.io
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

secrets:
  name: agentfabric-secrets

certManager:
  enabled: false
  email: ""
  issuer:
    create: true
    name: agentfabric-letsencrypt
    kind: ClusterIssuer
    server: https://acme-v02.api.letsencrypt.org/directory

monitoring:
  dashboards:
    enabled: true
  grafanaNamespace: monitoring
