---
# Secret Rotation CronJob
# Rotates the master encryption key on a weekly schedule (Sunday 2 AM UTC)
# Generates a new random key and re-encrypts all secrets

apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation
  namespace: default
  labels:
    app: agentfabric
    component: secret-rotation
spec:
  # Schedule: Weekly on Sunday at 2 AM UTC
  schedule: "0 2 * * 0"

  # Keep last 3 successful and 3 failed job runs for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Don't run if the previous run hasn't finished (prevent overlapping rotations)
  concurrencyPolicy: Forbid

  # Job spec
  jobTemplate:
    spec:
      # Timeout: 30 minutes max for rotation
      activeDeadlineSeconds: 1800

      # Backoff strategy: try 3 times before giving up
      backoffLimit: 3

      template:
        metadata:
          labels:
            app: agentfabric
            component: secret-rotation

        spec:
          # Abort the entire batch if a single container fails
          restartPolicy: Never

          # Run as non-root for security
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534

          serviceAccountName: secret-rotation

          initContainers:
          # Generate a new master key before rotation
          - name: generate-key
            image: agentfabric:latest
            imagePullPolicy: IfNotPresent

            command:
              - /bin/sh
              - -c
              - |
                # Generate a random 32-byte (256-bit) AES-256 key in hex format
                openssl rand -hex 32 > /tmp/master-key.txt
                ls -la /tmp/master-key.txt

            volumeMounts:
            - name: key-storage
              mountPath: /tmp

          containers:
          - name: rotator
            image: agentfabric:latest
            imagePullPolicy: IfNotPresent

            command: ["/usr/local/bin/rotate-secrets"]
            args:
              - "-dry-run=false"
              - "-new-key=/tmp/master-key.txt"
              - "-user=kubernetes-cronjob"

            env:
            # Database connection
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentfabric-db
                  key: url

            # Logging
            - name: GV_LOG_LEVEL
              value: "info"

            # Timeout
            - name: ROTATION_TIMEOUT_MINUTES
              value: "30"

            resources:
              requests:
                memory: "256Mi"
                cpu: "500m"
              limits:
                memory: "512Mi"
                cpu: "1000m"

            volumeMounts:
            - name: key-storage
              mountPath: /tmp
              readOnly: false

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL

          volumes:
          - name: key-storage
            emptyDir:
              sizeLimit: 10Mi

---
# ServiceAccount for the CronJob
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotation
  namespace: default
  labels:
    app: agentfabric
    component: secret-rotation

---
# ClusterRole for secret rotation (read-only access to get Database URL)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-rotation
  labels:
    app: agentfabric
    component: secret-rotation
rules:
# Allow reading the database secret
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["agentfabric-db"]
  verbs: ["get"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-rotation
  labels:
    app: agentfabric
    component: secret-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-rotation
subjects:
- kind: ServiceAccount
  name: secret-rotation
  namespace: default

---
# PrometheusRule for alerting on rotation failures
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secret-rotation-alerts
  namespace: default
  labels:
    app: agentfabric
    component: secret-rotation
spec:
  groups:
  - name: secret-rotation
    interval: 1m
    rules:
    # Alert if rotation fails
    - alert: SecretRotationFailed
      expr: |
        increase(kubernetes_cronjob_failures_total{cronjob="secret-rotation"}[1h]) > 0
      for: 5m
      labels:
        severity: critical
        component: secret-rotation
      annotations:
        summary: "Secret rotation failed"
        description: "Secret rotation CronJob has failed in the last hour"

    # Alert if rotation hasn't run in 8 days (expected weekly)
    - alert: SecretRotationNotRun
      expr: |
        time() - max(kubernetes_cronjob_last_complete_time{cronjob="secret-rotation"}) > 8 * 24 * 3600
      for: 10m
      labels:
        severity: warning
        component: secret-rotation
      annotations:
        summary: "Secret rotation hasn't run in 8 days"
        description: "Expected weekly rotation, but last successful run was >8 days ago"
