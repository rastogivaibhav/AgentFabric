# ─── Cost Report ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfabric-dashboard-cost
  namespace: {{ .Values.monitoring.grafanaNamespace | default "monitoring" }}
  labels:
    grafana_dashboard: "1"
    {{- include "agentfabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    grafana-folder: "AgentFabric"
data:
  cost-report.json: |
    {
      "__inputs": [{"name":"DS_PROMETHEUS","label":"Prometheus","description":"","type":"datasource","pluginId":"prometheus","pluginName":"Prometheus"}],
      "description": "AgentFabric — AI cost tracking, model spend, token economy, and budget alerting",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"title":"Cost Summary","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"yellow","value":10},{"color":"red","value":100}]},"unit":"currencyUSD"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":1},"id":1,"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"rate(agentfabric_cost_usd_total[1h]) * 3600","legendFormat":"USD/hour"}],"title":"Current Cost Rate (USD/hour)","type":"stat"},
