{{- $authValues := .Values.auth | default dict }}
{{- $oidcValues := $authValues.oidc | default dict }}
{{- $ssoRequired := $authValues.ssoRequired | default false }}
{{- $passwordLoginDisabled := $authValues.passwordLoginDisabled | default false }}
{{- $oidcIssuer := $oidcValues.issuer | default "" | trim }}
{{- $oidcClientID := $oidcValues.clientId | default "" | trim }}
{{- $oidcClientSecretKey := $oidcValues.clientSecretKey | default "" | trim }}
{{- $oidcRedirectURI := $oidcValues.redirectUri | default "" | trim }}
{{- $oidcLogoutURL := $oidcValues.logoutUrl | default "" | trim }}
{{- if and $passwordLoginDisabled (not $ssoRequired) (eq $oidcIssuer "") }}
{{- fail "auth.passwordLoginDisabled=true requires auth.ssoRequired=true or auth.oidc.issuer to configure OIDC SSO" }}
{{- end }}
{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: govagn-collector-config
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "collector") | nindent 4 }}
data:
  GV_ENV: {{ .Values.global.environment | quote }}
  GV_GRPC_ADDR: "0.0.0.0:4317"
  GV_HTTP_ADDR: "0.0.0.0:4318"
  GV_GATEWAY_ENDPOINT: "http://govagn-api:8080"
  GV_AUTH_REQUIRE_AUTH: "true"
  GV_DEBUG: "false"
  GV_PROCESSOR_WORKERS: {{ .Values.collector.env.GV_PROCESSOR_WORKERS | default "4" | quote }}
  GV_RATE_LIMIT_SPANS_PER_SECOND: {{ .Values.collector.env.GV_RATE_LIMIT_SPANS_PER_SECOND | default "10000" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: govagn-collector
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "govagn.selectorLabels" (dict "component" "collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "govagn.labels" . | nindent 8 }}
        {{- include "govagn.selectorLabels" (dict "component" "collector") | nindent 8 }}
    spec:
      containers:
        - name: collector
          image: {{ include "govagn.image" .Values.collector.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - configMapRef:
                name: govagn-collector-config
          env:
            - name: GV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secret
            - name: GV_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: gateway-auth-token
          readinessProbe:
            httpGet:
              path: /readyz
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: govagn-collector
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "collector") | nindent 4 }}
spec:
  selector:
    {{- include "govagn.selectorLabels" (dict "component" "collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}

{{- if .Values.api.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: govagn-api
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "govagn.labels" . | nindent 8 }}
        {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: {{ include "govagn.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GV_ENV
              value: {{ .Values.global.environment | quote }}
            - name: GV_STRICT_CONFIG
              value: "true"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: redis-url
            - name: GV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secret
            - name: GV_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: gateway-auth-token
            - name: GV_JWT_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secrets
            - name: GV_SSO_REQUIRED
              value: {{ ternary "true" "false" $ssoRequired | quote }}
            - name: GV_PASSWORD_LOGIN_DISABLED
              value: {{ ternary "true" "false" $passwordLoginDisabled | quote }}
            - name: GV_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: admin-password
            - name: GV_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: vault-key
            - name: GV_CORS_ORIGINS
              value: {{ join "," .Values.api.cors.allowedOrigins | quote }}
            {{- if or $ssoRequired $oidcIssuer }}
            - name: GV_OIDC_ISSUER
              value: {{ required "auth.ssoRequired=true requires auth.oidc.issuer" $oidcIssuer | quote }}
            {{- end }}
            {{- if or $ssoRequired $oidcClientID }}
            - name: GV_OIDC_CLIENT_ID
              value: {{ required "auth.ssoRequired=true requires auth.oidc.clientId" $oidcClientID | quote }}
            {{- end }}
            {{- if or $ssoRequired $oidcClientSecretKey }}
            - name: GV_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ required "auth.ssoRequired=true requires auth.oidc.clientSecretKey to point at the Kubernetes Secret key containing GV_OIDC_CLIENT_SECRET" $oidcClientSecretKey }}
            {{- end }}
            {{- if or $ssoRequired $oidcRedirectURI }}
            - name: GV_OIDC_REDIRECT_URI
              value: {{ required "auth.ssoRequired=true requires auth.oidc.redirectUri" $oidcRedirectURI | quote }}
            {{- end }}
            {{- if $oidcLogoutURL }}
            - name: GV_OIDC_LOGOUT_URL
              value: {{ $oidcLogoutURL | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: govagn-api
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: govagn-api
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: govagn-api
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "api") | nindent 4 }}
  annotations:
    {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    {{- range .Values.api.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: govagn-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
    {{- end }}
  tls:
    {{- toYaml .Values.api.ingress.tls | nindent 4 }}
{{- end }}
{{- end }}

{{- if .Values.portal.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: govagn-portal
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "govagn.labels" . | nindent 8 }}
        {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 8 }}
    spec:
      containers:
        - name: portal
          image: {{ include "govagn.image" .Values.portal.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: govagn-portal
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 4 }}
spec:
  selector:
    {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.portal.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: govagn-portal
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 4 }}
spec:
  minAvailable: {{ .Values.portal.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 6 }}
{{- end }}
{{- if .Values.portal.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: govagn-portal
  labels:
    {{- include "govagn.labels" . | nindent 4 }}
    {{- include "govagn.selectorLabels" (dict "component" "portal") | nindent 4 }}
  annotations:
    {{- toYaml .Values.portal.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.portal.ingress.className }}
  rules:
    {{- range .Values.portal.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: govagn-portal
                port:
                  number: 80
    {{- end }}
  tls:
    {{- toYaml .Values.portal.ingress.tls | nindent 4 }}
{{- end }}
{{- end }}
