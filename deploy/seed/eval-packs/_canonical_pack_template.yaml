schema_version: "1.0"

pack:
  id: "evalpack.core.agent_quality.v1"
  name: "Core Agent Quality Eval Pack"
  version: "1.0.0"
  owner: "ai-quality-office"
  status: "approved"
  effective_from: "2026-04-09"
  tags: ["evaluation", "quality", "runtime"]

defaults:
  scoring_scale: "0_to_1"
  aggregation: "weighted_mean"
  passing_threshold: 0.85
  warning_threshold: 0.70
  failure_action: "block_release"
  evidence_mode: "required"

datasets:
  - id: "golden_set.customer_support.v1"
    type: "golden"
    description: "Human-verified support interactions"
  - id: "adversarial.prompt_injection.v1"
    type: "red_team"
    description: "Prompt injection and jailbreak attempts"

dimensions:
  - id: "accuracy"
    weight: 0.25
  - id: "groundedness"
    weight: 0.20
  - id: "policy_compliance"
    weight: 0.20
  - id: "tool_correctness"
    weight: 0.15
  - id: "latency"
    weight: 0.10
  - id: "user_outcome"
    weight: 0.10

evaluators: []

gates:
  release_gate:
    min_overall_score: 0.85
    max_critical_failures: 0
    min_dataset_coverage: 0.95
  runtime_gate:
    min_online_score: 0.80
    max_policy_breach_rate: 0.005
    max_hallucination_rate: 0.01

reporting:
  produce_scorecard: true
  produce_failure_clusters: true
  attach_trace_links: true
  export_formats: ["json", "html", "markdown"]

approvals:
  quality_owner: "ai-quality@company.example"
  engineering_owner: "platform@company.example"
