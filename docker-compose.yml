# AgentFabric — Local development stack
# Removed: Kafka, Zookeeper, af-core, ClickHouse (unused in production data path)
# Data path: Agent SDK → Collector → api-gateway → PostgreSQL + Redis → Portal
#
# Usage: docker-compose up -d

networks:
  af-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:

services:

  # ─── Storage ────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentfabric
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric_dev_only
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema managed by golang-migrate (api-gateway runs migrations on startup).
    ports:
      - "5432:5432"
    networks: [af-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d agentfabric"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [af-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ─── AgentFabric Services ────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      AF_ENV: development
      DATABASE_URL: postgres://fabric:fabric_dev_only@postgres:5432/agentfabric?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      AF_JWT_SECRET: "dev-secret-change-in-prod"
      AF_JWT_SECRETS: "${AF_JWT_SECRETS:-}"
      LISTEN_ADDR: ":8080"
      AF_LOG_LEVEL: debug
      AF_CORS_ORIGINS: "http://localhost:3000"
      AF_AUTH_DISABLED: "true"
      AF_TLS_ENABLED: "${AF_TLS_ENABLED:-false}"
      AF_TLS_CERT_FILE: "/certs/server.crt"
      AF_TLS_KEY_FILE:  "/certs/server.key"
      AF_TLS_CA_FILE:   "/certs/ca.crt"
      AF_MIGRATIONS_PATH: "/migrations"
      AF_BUDGET_ENABLED: "${AF_BUDGET_ENABLED:-true}"
    volumes:
      - ./deploy/certs:/certs:ro
      - ./deploy/migrations:/migrations:ro
    ports:
      - "8080:8080"
    networks: [af-net]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    environment:
      AF_ENV: development
      AF_GRPC_ADDR: "0.0.0.0:4317"
      AF_HTTP_ADDR: "0.0.0.0:4318"
      AF_GATEWAY_ENDPOINT: "http://api-gateway:8080"
      AF_AUTH_REQUIRE_AUTH: "false"
      AF_JWT_SECRET: "dev-secret-change-in-prod"
      AF_TLS_ENABLED: "${AF_TLS_ENABLED:-false}"
      AF_TLS_CERT_FILE: "/certs/server.crt"
      AF_TLS_KEY_FILE:  "/certs/server.key"
      AF_TLS_CA_FILE:   "/certs/ca.crt"
      AF_DEBUG: "true"
      AF_PROCESSOR_WORKERS: "4"
    volumes:
      - ./deploy/certs:/certs:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [af-net]
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8080"
        VITE_WS_URL: "ws://localhost:8080"
        VITE_AUTH_DISABLED: "true"
    ports:
      - "3000:80"
    networks: [af-net]
    depends_on: [api-gateway]

  # ─── Observability ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    networks: [af-net]
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    ports: ["9093:9093"]
    networks: [af-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-grafana_dev_only}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentfabric-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["9091:3000"]
    networks: [af-net]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"
    networks: [af-net]
