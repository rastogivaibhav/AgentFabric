name: ARC Paper Real Game Off vs Evidence vs Dialectic

on:
  pull_request:
    branches: [pi45-a15-dialectical-model-world-20260821]
    paths:
      - '.github/workflows/arc-paper-real-game-off-vs-evidence.yml'
      - 'arc_competition/graphene_dmw_native_gate.py'
      - 'arc_competition/build_duck_dialectic_native_helper.sh'
  push:
    branches: [arc-paper-dmw-duck-20260821]
    paths:
      - '.github/workflows/arc-paper-real-game-off-vs-evidence.yml'
      - 'arc_competition/graphene_dmw_native_gate.py'
      - 'arc_competition/build_duck_dialectic_native_helper.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-arc-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.pulapi }}
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_PROVIDER: openai
      LOCAL_ANALYZER_API_KEY: ${{ secrets.pulapi }}
      LOCAL_ANALYZER_BASE_URL: https://api.openai.com/v1
      LOCAL_ANALYZER_PROVIDER: openai
      LOCAL_ANALYZER_MODEL_ID: gpt-5.6-sol
      LOCAL_ANALYZER_CONTEXT_WINDOW: '32768'
      LOCAL_ANALYZER_TOOL_STEPS: '6'
      LOCAL_ANALYZER_TOOL_TIMEOUT: '30'
      LOCAL_ANALYZER_TIMEOUT: '120'
      LOCAL_ANALYZER_ENABLE_THINKING: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Verify diagnostic model access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          code=$(curl -sS -o /tmp/model.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models/gpt-5.6-sol)
          test "$code" = 200
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/model.json'))
          assert x.get('id')=='gpt-5.6-sol'
          print('openai_diagnostic_model_access=PASS model=gpt-5.6-sol')
          PY

      - name: Build unchanged native runtime for dialectic arm
        shell: bash
        run: |
          set -euo pipefail
          bash pi45_a1/a15_native_runtime_proof.sh /tmp/a15-native-runtime-proof
          bash arc_competition/build_duck_dialectic_native_helper.sh /tmp/duck_dialectic_native_helper
          test -x /tmp/a15_graphene_bootstrap
          test -x /tmp/duck_dialectic_native_helper
          git diff --exit-code -- pi45_a1/a15_native_runtime pi45_a1/graphenedb_snapshot pi45_a1/a15_native_runtime_helper.cpp

      - name: Fetch pinned Duck and public ARC environment assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/duck-harness /tmp/arc-public-envs
          git clone --filter=blob:none https://github.com/Tufalabs/duck-harness.git /tmp/duck-harness
          git -C /tmp/duck-harness checkout 7652836056c59e044f093e3c13ed7438c814169e
          test "$(git -C /tmp/duck-harness rev-parse HEAD)" = '7652836056c59e044f093e3c13ed7438c814169e'
          python3 arc_competition/apply_duck_graphene_patch_v2.py /tmp/duck-harness \
            --manifest-out /tmp/duck_patch_manifest.json
          git clone --depth=1 https://huggingface.co/datasets/zarczynski/arc-agi-3-public /tmp/arc-public-envs
          test -d /tmp/arc-public-envs/environment_files/ft09/0d8bbf25
          find /tmp/arc-public-envs/environment_files/ft09/0d8bbf25 -maxdepth 2 -type f -print | sort | tee /tmp/ft09-env-files.txt

      - name: Configure external diagnostic model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/duck-harness/ARC3-Inference/configs/inference.json')
          c=json.loads(p.read_text())
          c['shared'].update({
              'model_name':'gpt-5.6-sol',
              'base_url':'https://api.openai.com/v1',
              'provider':'openai',
              'context_window':32768,
          })
          c['environment'].update({
              'games':['ft09-0d8bbf25'],
              'include_tags':[],
              'environments_dir':'/tmp/arc-public-envs/environment_files',
              'n_passes':1,
              'concurrent_jobs':1,
              'max_steps':12,
              'max_runtime_minutes':8,
          })
          c['deployment']['target']='inline'
          c['analyzer'].update({
              'model_id':'gpt-5.6-sol',
              'base_url':'https://api.openai.com/v1',
              'provider':'openai',
              'context_window':32768,
              'tool_steps':6,
              'timeout':120,
              'save_request_logs':True,
          })
          c['multimodal']['context']=''
          q=Path('/tmp/arc-openai.json')
          q.write_text(json.dumps(c,indent=2,sort_keys=True))
          print(q)
          PY

      - name: Install CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          cd /tmp/duck-harness/ARC3-Inference
          uv venv --python 3.12.12 .venv
          uv sync --locked --python .venv/bin/python
          uv pip install --python .venv/bin/python --no-deps -e ../tufa-arc-agi-framework

      - name: Run real ARC baseline off
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/duck-harness/ARC3-Inference
          rm -rf /tmp/arc-real-off
          GRAPHENE_DMW_MODE=off \
          CONFIG_PATH=/tmp/arc-openai.json EXPERIMENT_DIR=/tmp/arc-real-off \
          GAME=ft09-0d8bbf25 GAME_TAGS='[]' ENVIRONMENTS_DIR=/tmp/arc-public-envs/environment_files \
          N_PASSES=1 CONCURRENT_JOBS=1 MAX_ACTIONS=12 MAX_RUNTIME_MINUTES=8 SIMULATE_COMPETITION_ARCADE=true \
          make interactive
          CONFIG_PATH=/tmp/arc-openai.json make score_run \
            SCORE_RUN_DIR=/tmp/arc-real-off SCORE_OUTPUT_PATH=/tmp/arc-real-off/evaluation.json

      - name: Run real ARC Graphene evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/duck-harness/ARC3-Inference
          rm -rf /tmp/arc-real-evidence
          GRAPHENE_DMW_MODE=evidence \
          CONFIG_PATH=/tmp/arc-openai.json EXPERIMENT_DIR=/tmp/arc-real-evidence \
          GAME=ft09-0d8bbf25 GAME_TAGS='[]' ENVIRONMENTS_DIR=/tmp/arc-public-envs/environment_files \
          N_PASSES=1 CONCURRENT_JOBS=1 MAX_ACTIONS=12 MAX_RUNTIME_MINUTES=8 SIMULATE_COMPETITION_ARCADE=true \
          make interactive
          CONFIG_PATH=/tmp/arc-openai.json make score_run \
            SCORE_RUN_DIR=/tmp/arc-real-evidence SCORE_OUTPUT_PATH=/tmp/arc-real-evidence/evaluation.json

      - name: Run real ARC Graphene dialectic
        shell: bash
        env:
          GRAPHENE_DMW_MODE: dialectic
          GRAPHENE_DMW_NATIVE_HELPER: /tmp/duck_dialectic_native_helper
          GRAPHENE_DMW_BOOTSTRAP: /tmp/a15_graphene_bootstrap
          GRAPHENE_DMW_WORLD_SCOPE: ft09-diagnostic-dialectic
        run: |
          set -euo pipefail
          cd /tmp/duck-harness/ARC3-Inference
          rm -rf /tmp/arc-real-dialectic
          CONFIG_PATH=/tmp/arc-openai.json EXPERIMENT_DIR=/tmp/arc-real-dialectic \
          GAME=ft09-0d8bbf25 GAME_TAGS='[]' ENVIRONMENTS_DIR=/tmp/arc-public-envs/environment_files \
          N_PASSES=1 CONCURRENT_JOBS=1 MAX_ACTIONS=12 MAX_RUNTIME_MINUTES=8 SIMULATE_COMPETITION_ARCADE=true \
          make interactive
          CONFIG_PATH=/tmp/arc-openai.json make score_run \
            SCORE_RUN_DIR=/tmp/arc-real-dialectic SCORE_OUTPUT_PATH=/tmp/arc-real-dialectic/evaluation.json

      - name: Compare real ARC results
        shell: bash
        run: |
          set -euo pipefail
          OUT=results/arc-paper/real-arc-three-arm
          mkdir -p "$OUT"
          cp /tmp/arc-real-off/evaluation.json "$OUT/off-evaluation.json"
          cp /tmp/arc-real-evidence/evaluation.json "$OUT/evidence-evaluation.json"
          cp /tmp/arc-real-dialectic/evaluation.json "$OUT/dialectic-evaluation.json"
          cp /tmp/duck_patch_manifest.json "$OUT/"
          cp /tmp/ft09-env-files.txt "$OUT/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('results/arc-paper/real-arc-three-arm')
          game='ft09-0d8bbf25'
          def load(name): return json.load(open(out/f'{name}-evaluation.json'))
          def g(x):
              row=x['games'][game]
              return {
                  'overall_score':float(x.get('score') or 0),
                  'game_score':float(row.get('score') or 0),
                  'seed_count':int(row.get('seed_count') or 0),
                  'trial_count':int(row.get('trial_count') or 0),
                  'trial_scores':row.get('trial_scores') or {},
              }
          summary={
              'experiment':'real ARC-AGI-3 ft09 three-arm diagnostic',
              'game':game,
              'model':'gpt-5.6-sol',
              'competition_valid_model':False,
              'environment_asset_source':'zarczynski/arc-agi-3-public',
              'purpose':'causal integration diagnostic; final Kaggle path remains Qwen3.6-27B-FP8 offline',
              'action_cap':12,
              'off':g(load('off')),
              'evidence':g(load('evidence')),
              'dialectic':g(load('dialectic')),
          }
          summary['evidence_score_delta_vs_off']=summary['evidence']['game_score']-summary['off']['game_score']
          summary['dialectic_score_delta_vs_off']=summary['dialectic']['game_score']-summary['off']['game_score']
          summary['dialectic_score_delta_vs_evidence']=summary['dialectic']['game_score']-summary['evidence']['game_score']
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          for mode in off evidence dialectic; do
            find "/tmp/arc-real-$mode" -type f -name 'graphene_dmw_state.json' -exec cp {} "$OUT/$mode-graphene-state.json" \; || true
            find "/tmp/arc-real-$mode" -type f \( -name 'runtime_state.json' -o -name 'final_score.json' \) -print | sort > "$OUT/$mode-runtime-files.txt" || true
          done
          printf '%s\n' \
            "agentfabric_commit=${GITHUB_SHA}" \
            'duck_commit=7652836056c59e044f093e3c13ed7438c814169e' \
            'game=ft09-0d8bbf25' \
            'model=gpt-5.6-sol' \
            'competition_valid_model=false' \
            'diagnostic_external_api=true' \
            'three_arms=off,evidence,dialectic' \
            'native_hypokosh_action_seam=true' \
            'final_submission_external_api=false' \
            > "$OUT/identity.txt"
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

      - name: Upload real ARC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-paper-real-game-three-arm
          path: results/arc-paper/real-arc-three-arm
          if-no-files-found: warn
          retention-days: 30
