version: '3.9'

# AgentFabric — Minimal production stack (no Kafka/ClickHouse/monitoring)
# Run from the repo root: docker compose -f deploy/docker/docker-compose.yml up -d

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentfabric
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../deploy/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d agentfabric"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── AgentFabric Collector ────────────────────────────────────────────────────
  collector:
    build:
      context: ../../collector
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AF_GRPC_ADDR: ":4317"
      AF_HTTP_ADDR: ":4318"
      AF_GATEWAY_ENDPOINT: "http://api-gateway:8080"
      AF_JWT_SECRET: ${AF_JWT_SECRET:-dev-secret-change-in-prod}
      AF_AUTH_REQUIRE_AUTH: "false"  # disable for local dev
      AF_PROCESSOR_WORKERS: "4"
      AF_NODE_NAME: "local-collector"
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
      - "9090:9090"   # Prometheus metrics
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4318/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://fabric:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agentfabric?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      AF_JWT_SECRET: ${AF_JWT_SECRET:-dev-secret-change-in-prod}
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Portal ───────────────────────────────────────────────────────────────────
  portal:
    build:
      context: ../../portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${PORTAL_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  pg_data:
  redis_data:

networks:
  default:
    name: agentfabric
