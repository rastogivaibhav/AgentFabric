global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager:9093 when deployed

scrape_configs:
  - job_name: 'agentfabric-collector'
    static_configs:
      - targets: ['collector:4318']
    metrics_path: /metrics

  - job_name: 'agentfabric-api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
