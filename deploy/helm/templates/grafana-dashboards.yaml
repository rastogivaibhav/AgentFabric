# ─── Audit & Policy ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfabric-dashboard-audit
  namespace: {{ .Values.monitoring.grafanaNamespace | default "monitoring" }}
  labels:
    grafana_dashboard: "1"
    {{- include "agentfabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    grafana-folder: "AgentFabric"
data:
  audit-policy.json: |
    {
      "__inputs": [{"name":"DS_PROMETHEUS","label":"Prometheus","description":"","type":"datasource","pluginId":"prometheus","pluginName":"Prometheus"}],
      "description": "AgentFabric — audit log chain health, PII redaction, policy enforcement, and compliance",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"title":"Audit Chain Health","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"options":{"0":{"color":"red","index":0,"text":"BROKEN"},"1":{"color":"green","index":1,"text":"INTACT"}},"type":"value"}],"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":1},"id":1,"options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"agentfabric_audit_chain_valid","legendFormat":"Chain"}],"title":"Audit Chain Integrity","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":6,"y":1},"id":2,"description":"MUST stay at 1. More than 1 replica breaks the audit hash chain (single-process Mutex). See runbook.","options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"kube_deployment_spec_replicas{deployment=~\".*af-core.*\"}","legendFormat":"af-core replicas"}],"title":"af-core Replica Count","type":"stat"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":13},"id":101,"title":"PII Redaction","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":10},{"color":"red","value":100}]},"unit":"short"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":14},"id":5,"options":{"colorMode":"background","graphMode":"area","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"rate(agentfabric_pii_redactions_total[5m]) * 60","legendFormat":"PII/min"}],"title":"PII Redactions (per minute)","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":20,"lineWidth":2},"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":18},"id":7,"options":{"legend":{"calcs":["sum"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_pii_redactions_total[5m])) by (pii_type) * 60","legendFormat":"{{ pii_type }}"}],"title":"PII Redactions by Type","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":26},"id":102,"title":"Policy Enforcement","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]},"unit":"short"},"overrides":[]},"gridPos":{"h":4,"w":6,"x":0,"y":27},"id":9,"options":{"colorMode":"background","graphMode":"area","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"]}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"rate(agentfabric_policy_decisions_total{result=\"deny\"}[5m]) * 60","legendFormat":"Blocks/min"}],"title":"Policy Blocks (per minute)","type":"stat"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":15,"lineWidth":2},"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":31},"id":11,"options":{"legend":{"calcs":["sum"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_policy_decisions_total[5m])) by (result) * 60","legendFormat":"{{ result }}"}],"title":"Policy Decisions by Result (per minute)","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":15,"lineWidth":2},"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":31},"id":12,"options":{"legend":{"calcs":["sum"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_policy_decisions_total{result=\"deny\"}[5m])) by (policy_name) * 60","legendFormat":"{{ policy_name }}"}],"title":"Policy Blocks by Policy Name","type":"timeseries"}
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["agentfabric","audit","compliance","policy","pii"],
      "time": {"from":"now-6h","to":"now"},
      "timezone": "browser",
      "title": "AgentFabric — Audit & Policy",
      "uid": "agentfabric-audit",
      "version": 1
    }
{{- end }}
