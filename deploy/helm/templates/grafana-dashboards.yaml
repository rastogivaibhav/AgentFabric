# ─── Framework Breakdown ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfabric-dashboard-framework
  namespace: {{ .Values.monitoring.grafanaNamespace | default "monitoring" }}
  labels:
    grafana_dashboard: "1"
    {{- include "agentfabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    grafana-folder: "AgentFabric"
data:
  framework-breakdown.json: |
    {
      "__inputs": [{"name":"DS_PROMETHEUS","label":"Prometheus","description":"","type":"datasource","pluginId":"prometheus","pluginName":"Prometheus"}],
      "description": "AgentFabric — per-framework span volume, token usage, latency, and error rates",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":100,"title":"Framework Distribution","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"}},"overrides":[]},"gridPos":{"h":8,"w":8,"x":0,"y":1},"id":1,"options":{"displayLabels":["name","percent"],"legend":{"displayMode":"table","placement":"right","values":["value","percent"]},"pieType":"donut","tooltip":{"mode":"single"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_spans_received_total[10m])) by (framework)","legendFormat":"{{ framework }}"}],"title":"Span Share by Framework (10m)","type":"piechart"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":10,"lineWidth":2},"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":16,"x":8,"y":1},"id":2,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_spans_received_total[2m])) by (framework) * 60","legendFormat":"{{ framework }}"}],"title":"Spans/min by Framework","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":9},"id":101,"title":"Token Usage","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":10,"lineWidth":2},"unit":"short"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":10},"id":3,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_tokens_total{type=\"input\"}[5m])) by (framework) * 60","legendFormat":"{{ framework }} input"},{"datasource":{"uid":"agentfabric-prometheus"},"expr":"sum(rate(agentfabric_tokens_total{type=\"output\"}[5m])) by (framework) * 60","legendFormat":"{{ framework }} output"}],"title":"Tokens/min by Framework (input vs output)","type":"timeseries"},
        {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":18},"id":102,"title":"Agent Run Latency","type":"row"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":10,"lineWidth":2},"unit":"s"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":19},"id":5,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi","sort":"desc"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"histogram_quantile(0.95, sum(rate(agentfabric_agent_run_duration_seconds_bucket[5m])) by (le, framework))","legendFormat":"{{ framework }} P95"}],"title":"Agent Run P95 Latency by Framework","type":"timeseries"},
        {"datasource":{"type":"prometheus","uid":"agentfabric-prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"fillOpacity":20,"lineWidth":2},"min":0,"max":100,"unit":"percent"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":19},"id":6,"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom"},"tooltip":{"mode":"multi"}},"targets":[{"datasource":{"uid":"agentfabric-prometheus"},"expr":"100 * sum(rate(agentfabric_agent_runs_total{status=\"error\"}[5m])) by (framework) / sum(rate(agentfabric_agent_runs_total[5m])) by (framework)","legendFormat":"{{ framework }} error %"}],"title":"Agent Run Error Rate by Framework","type":"timeseries"}
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["agentfabric","frameworks","ai-agents"],
      "time": {"from":"now-1h","to":"now"},
      "timezone": "browser",
      "title": "AgentFabric — Framework Breakdown",
      "uid": "agentfabric-framework",
      "version": 1
    }

