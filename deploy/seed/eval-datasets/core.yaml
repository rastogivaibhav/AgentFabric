schema_version: "1.0"
dataset:
  id: "golden_set.customer_support"
  version: "v1"
  ref: "golden_set.customer_support.v1"
  name: "Golden Customer Support Set"
  type: "golden"
  owner: "ai-quality-office"
  status: "approved"
  source: "seed"
  description: "Human-reviewed support interactions for quality and grounding checks"
  tags: ["core", "support"]
items:
  - key: "support-001"
    input:
      prompt: "Customer asks whether a refund is possible for an order placed 10 days ago."
      response: "A refund is available within the 30 day return window."
      task_constraints:
        format: "plain_text"
      retrieved_context:
        - "Return policy: items can be refunded within 30 days of purchase."
      citations:
        - "kb://returns/policy"
    expected:
      gold_answer: "Refunds are available within 30 days of purchase."
      expected_outcome: "ok"
      supported_claim_ratio: 1.0
    metadata:
      domain: "support"
    labels: ["golden", "refunds"]
  - key: "support-002"
    input:
      prompt: "Customer asks for shipping speed options."
      response: "Standard shipping arrives in 3 to 5 business days."
      task_constraints:
        format: "plain_text"
      retrieved_context:
        - "Shipping policy: standard shipping takes 3-5 business days."
      citations:
        - "kb://shipping/options"
    expected:
      gold_answer: "Standard shipping takes 3 to 5 business days."
      expected_outcome: "ok"
      supported_claim_ratio: 1.0
    metadata:
      domain: "support"
    labels: ["golden", "shipping"]
