[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfabric"
version = "1.0.0"
description = "Production-grade OpenTelemetry instrumentation for AI agent frameworks"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AgentFabric Team"}]
keywords = ["opentelemetry", "otel", "ai-agents", "crewai", "langgraph", "observability", "tracing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.9"
dependencies = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.30.0"]
langchain = ["langchain>=0.2.0", "langgraph>=0.1.0"]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.28.0"]
all = [
    "crewai>=0.30.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4.0",
    "respx>=0.20.0",
    "httpx>=0.27.0",
]
integration = [
    "crewai>=0.30.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "respx>=0.20.0",
    "httpx>=0.27.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://agentfabric.io"
Documentation = "https://docs.agentfabric.io"
Repository = "https://github.com/agentfabric/agentfabric-python"
Issues = "https://github.com/agentfabric/agentfabric-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfabric*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require real framework packages installed",
    "api: tests that make real external API calls (requires valid credentials)",
]
