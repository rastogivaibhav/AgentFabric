name: PI4.5A.1.4 GrapheneDB seed contract probe

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/pi45a14-contract-probe.yml'
      - 'pi45_a1/a14_prior.json'
      - 'pi45_a1/a14_seed_graphene.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct frozen A1 payload
        shell: bash
        run: |
          set -euo pipefail
          cat pi45_a1/payload.part.00 pi45_a1/payload.part.01 pi45_a1/payload.part.02 > /tmp/pi45a1_payload.tgz.b64
          echo '6e23baa3a1c6b9855c1cdfd38f6ce367d95b524ee59a97be7113be08555b0fc7  /tmp/pi45a1_payload.tgz.b64' | sha256sum -c -
          base64 -d /tmp/pi45a1_payload.tgz.b64 > /tmp/pi45a1_payload.tgz
          echo '0e10bc6e81feab2071d1e75b1dc398656e666801ae0a608edf747b25af5857d6  /tmp/pi45a1_payload.tgz' | sha256sum -c -
          mkdir -p /tmp/pi45a1
          tar -xzf /tmp/pi45a1_payload.tgz -C /tmp/pi45a1
      - name: Show exact frozen retrieval and prompt contract
        shell: bash
        run: |
          set -euo pipefail
          echo '=== grid feature vector + GrapheneDB adapter ==='
          sed -n '180,255p' /tmp/pi45a1/arc_a1_graphene_episodic.py
          echo '=== prompt builder ==='
          sed -n '255,310p' /tmp/pi45a1/arc_a1_graphene_episodic.py
          echo '=== play loop retrieval/put ==='
          sed -n '312,490p' /tmp/pi45a1/arc_a1_graphene_episodic.py
          echo '=== helper implementation ==='
          sed -n '1,145p' /tmp/pi45a1/pi45_graphene_memory.cpp
          python3 pi45_a1/a14_seed_graphene.py pi45_a1/a14_prior.json /tmp/a14_seed_records.jsonl
          wc -l /tmp/a14_seed_records.jsonl
