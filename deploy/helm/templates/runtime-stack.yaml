{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfabric-collector-config
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "collector") | nindent 4 }}
data:
  AF_ENV: {{ .Values.global.environment | quote }}
  AF_GRPC_ADDR: "0.0.0.0:4317"
  AF_HTTP_ADDR: "0.0.0.0:4318"
  AF_GATEWAY_ENDPOINT: "http://agentfabric-api:8080"
  AF_AUTH_REQUIRE_AUTH: "true"
  AF_DEBUG: "false"
  AF_PROCESSOR_WORKERS: {{ .Values.collector.env.AF_PROCESSOR_WORKERS | default "4" | quote }}
  AF_RATE_LIMIT_SPANS_PER_SECOND: {{ .Values.collector.env.AF_RATE_LIMIT_SPANS_PER_SECOND | default "10000" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfabric-collector
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentfabric.selectorLabels" (dict "component" "collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentfabric.labels" . | nindent 8 }}
        {{- include "agentfabric.selectorLabels" (dict "component" "collector") | nindent 8 }}
    spec:
      containers:
        - name: collector
          image: {{ include "agentfabric.image" .Values.collector.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - configMapRef:
                name: agentfabric-collector-config
          env:
            - name: AF_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secret
            - name: AF_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: gateway-auth-token
          readinessProbe:
            httpGet:
              path: /readyz
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentfabric-collector
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "collector") | nindent 4 }}
spec:
  selector:
    {{- include "agentfabric.selectorLabels" (dict "component" "collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}

{{- if .Values.api.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfabric-api
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentfabric.labels" . | nindent 8 }}
        {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: {{ include "agentfabric.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AF_ENV
              value: {{ .Values.global.environment | quote }}
            - name: AF_STRICT_CONFIG
              value: "true"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: redis-url
            - name: AF_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secret
            - name: AF_JWT_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: jwt-secrets
            - name: AF_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: admin-password
            - name: AF_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: vault-key
            - name: AF_CORS_ORIGINS
              value: {{ join "," .Values.api.cors.allowedOrigins | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentfabric-api
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentfabric-api
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentfabric-api
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "api") | nindent 4 }}
  annotations:
    {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    {{- range .Values.api.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: agentfabric-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
    {{- end }}
  tls:
    {{- toYaml .Values.api.ingress.tls | nindent 4 }}
{{- end }}
{{- end }}

{{- if .Values.portal.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfabric-portal
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentfabric.labels" . | nindent 8 }}
        {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 8 }}
    spec:
      containers:
        - name: portal
          image: {{ include "agentfabric.image" .Values.portal.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentfabric-portal
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 4 }}
spec:
  selector:
    {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.portal.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentfabric-portal
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 4 }}
spec:
  minAvailable: {{ .Values.portal.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 6 }}
{{- end }}
{{- if .Values.portal.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentfabric-portal
  labels:
    {{- include "agentfabric.labels" . | nindent 4 }}
    {{- include "agentfabric.selectorLabels" (dict "component" "portal") | nindent 4 }}
  annotations:
    {{- toYaml .Values.portal.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.portal.ingress.className }}
  rules:
    {{- range .Values.portal.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentfabric-portal
                port:
                  number: 80
    {{- end }}
  tls:
    {{- toYaml .Values.portal.ingress.tls | nindent 4 }}
{{- end }}
{{- end }}
