[package]
name = "af-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "af-core"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Kafka consumer — cmake-build statically links librdkafka (no runtime C dep)
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for ClickHouse HTTP API
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Health / management HTTP server
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
